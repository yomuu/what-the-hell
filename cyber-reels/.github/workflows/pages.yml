# Publishes the app to GitHub Pages whenever main changes (for example when you merge a weekly content PR).
# Only the app's own files are published: no inbox drafts, logs, tools or agent settings.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the app
        run: node tools/check.js
      - name: Collect the files to publish
        run: |
          mkdir -p _site/content
          cp index.html app.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png icon-maskable-512.png cyber-reels.html .nojekyll _site/
          cp content/study.json content/feed.json content/python.json content/version.json _site/content/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
