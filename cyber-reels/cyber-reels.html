{t:"Your first script",
 sub:"Why security people use Python, and how to run it.",
 learn:[
  ["Why Python","Python is the most common scripting language in security. Analysts use it to parse logs, call APIs, automate checks and glue tools together. Kali already has Python 3 installed."],
  ["Two ways to run it","Type `python3` to open the interactive prompt and try lines one at a time. Or save code in a file ending in .py and run `python3 hello.py`. Leave the prompt with `exit()`."],
  ["print and comments","`print()` shows output. Anything after `#` is a comment that Python ignores. Use comments to explain why, not what.", String.raw`# Say hello to the SOC
print("Hello, SOC")
print(2 + 3)`],
  ["Indentation is syntax","Python groups code by indentation, not braces. Lines inside an if or a loop are indented, usually by four spaces. What Python requires is consistency; getting it wrong is an error, not a style issue.", String.raw`if 2 > 1:
    print("indented, so inside the if")
print("back outside")`]
 ],
 real:["On the job","A SOC analyst gets 2,000 alerts exported to a file. Reading them by hand takes a day. A 15-line script sorts and counts them in a second. That's why so many security job ads mention Python."],
 myth:["You have to be a programmer to use Python in security.","Most security scripts are short: read something, filter it, count it, print it. You'll write useful ones by the end of this track."],
 tryit:{h:"Run a script", where:"Kali terminal",
  p:"Create a file, run it, then change the message and run it again.",
  code:String.raw`echo 'print("Hello from Kali")' > hello.py
python3 hello.py`},
 quiz:[
  {d:1, run:true, q:"What does this print?", code:String.raw`print(2 + 3)
# print(10)`, o:["5","10","2 + 3"], k:0,
   w:"The second line is a comment, so only `print(2 + 3)` runs."},
  {d:1, q:"How do you run a script saved as scan.py?", o:["python3 scan.py","run scan.py","print scan.py"], k:0,
   w:"Give the file to the python3 interpreter."},
  {d:2, q:"What happens when you run this?", code:String.raw`if True:
print("hi")`, o:["An IndentationError","It prints hi","It prints nothing"], k:0,
   w:"The body of an if must be indented. Python refuses to run the file."}
 ],
 recap:["Python is the security team's glue language.","Run it with `python3` or `python3 file.py`.","`print()` shows output; `#` starts a comment.","Indentation groups code."]},

{t:"Variables and types",
 sub:"Names for values, and why text isn't a number.",
 learn:[
  ["Variables","A variable is a name for a value. You create one by assigning to it with `=`. Pick names that say what the value is, like `target_ip`, not `x`.", String.raw`target_ip = "10.10.10.20"
port = 445
print(target_ip, port)`],
  ["The core types","`str` is text, `int` is a whole number, `float` has a decimal point and `bool` is True or False. `type()` tells you which one you have."],
  ["Text isn't a number","Anything you read from a file, a log or user input arrives as text. \"22\" + \"1\" joins text into \"221\"; it doesn't add. Convert with `int()` before doing maths."],
  ["Converting","`int(\"22\")` turns text into a number and `str(22)` turns a number into text. Converting text that isn't a number, like `int(\"ssh\")`, raises a ValueError."]
 ],
 real:["On the job","A firewall export lists ports as text. A script that checks `\"80\" > \"443\"` says True, because text compares character by character and 8 beats 4. As numbers, 80 > 443 is False. Converting to int first fixes it."],
 myth:["Python works out what you meant, so types don't matter.","Python won't guess. Mixing text and numbers either raises an error or quietly does the wrong thing."],
 tryit:{h:"Try types in the prompt", where:"Kali: run python3",
  p:"Type each line into the Python prompt and predict the result before you press Enter.",
  code:String.raw`type(22)
type("22")
"22" + "1"
int("22") + 1`},
 quiz:[
  {d:1, run:true, q:"What does this print?", code:String.raw`port = "22"
print(port + "1")`, o:["221","23","An error"], k:0,
   w:"Both values are text, so `+` joins them."},
  {d:2, run:true, q:"What does this print?", code:String.raw`port = "22"
print(int(port) + 1)`, o:["23","221","An error"], k:0,
   w:"`int()` converts the text to a number first, so this is real addition."},
  {d:2, run:true, q:"What does this print?", code:String.raw`print(type(3.0))`, o:["<class 'float'>","<class 'int'>","3"], k:0,
   w:"The decimal point makes it a float, even though the value is a whole number."}
 ],
 recap:["Assign with `=`, and use descriptive names.","str, int, float and bool are the core types.","Input from files and logs is text.","Convert with `int()` and `str()` before mixing."]},

{t:"Working with strings",
 sub:"Slicing, splitting and searching text.",
 learn:[
  ["String methods","Strings come with built-in methods. `.lower()` and `.upper()` change case, `.strip()` removes spaces and newlines from the ends, and `.replace()` swaps text.", String.raw`user = "  Admin \n"
print(user.strip().lower())`],
  ["Split into parts","`.split()` breaks a string into a list of words. With an argument it splits on that character instead. It's the quickest way to pull fields out of a log line.", String.raw`line = "Failed password for root from 10.0.0.5"
parts = line.split()
print(parts[-1])`],
  ["Searching","`in` checks whether text appears anywhere in a string. `.startswith()` and `.endswith()` check the ends. All of them are case-sensitive."],
  ["f-strings","Put an f before the quotes and you can drop variables straight into text with braces. They're the clearest way to build output and messages.", String.raw`ip = "10.10.10.20"
open_ports = 3
print(f"{ip} has {open_ports} open ports")`]
 ],
 real:["On the job","Phishing triage often starts with string checks: does the sender's domain end with your company's domain, or with a look-alike? A couple of `.endswith()` and `.lower()` calls handle that."],
 myth:["`in` and `==` do the same thing.","`==` needs an exact match. `in` finds text anywhere, so \"admin\" in \"sysadmin\" is True. That difference causes real filtering bugs."],
 tryit:{h:"Pull fields from a log line", where:"Kali: python3",
  p:"Split a real-looking SSH log line and print the user and IP address.",
  code:String.raw`line = "Failed password for invalid user test from 10.10.10.10 port 51234 ssh2"
parts = line.split()
print("user:", parts[5])
print("ip:", parts[7])`},
 quiz:[
  {d:2, run:true, q:"What does this print?", code:String.raw`line = "Failed password for root"
print(line.split()[2])`, o:["for","password","root"], k:0,
   w:"Counting starts at 0: Failed is 0, password is 1, for is 2."},
  {d:1, run:true, q:"What does this print?", code:String.raw`print("admin" in "sysadmin")`, o:["True","False","An error"], k:0,
   w:"`in` matches anywhere inside the string, which is easy to forget when filtering usernames."},
  {d:1, run:true, q:"What does this print?", code:String.raw`ip = "10.10.10.20"
print(f"Scanning {ip}")`, o:["Scanning 10.10.10.20","Scanning {ip}","f\"Scanning {ip}\""], k:0,
   w:"The f prefix fills in the braces with the variable's value."}
 ],
 recap:["`.strip()`, `.lower()` and `.split()` do most text clean-up.","`in` matches anywhere; `==` needs an exact match.","Indexes start at 0, and -1 is the last item.","f-strings build readable output."]},

{t:"Lists and loops",
 sub:"Doing the same thing to many items.",
 learn:[
  ["Lists","A list holds items in order, in square brackets. Get an item by its index, starting at 0. `len()` gives the number of items and `.append()` adds one to the end.", String.raw`ports = [22, 80, 443]
ports.append(3389)
print(ports[0], len(ports))`],
  ["for loops","A for loop runs its indented block once for each item. This is how you check every host, every port or every log line.", String.raw`for port in [22, 80, 443]:
    print("checking", port)`],
  ["range","`range(1, 5)` produces 1, 2, 3 and 4. The end number is not included. It's handy for port ranges and counting."],
  ["Filtering as you go","Combine a loop and an if to keep only what matters. Build a new list of matches, then work with that.", String.raw`ports = [21, 22, 23, 80, 443]
risky = []
for p in ports:
    if p in (21, 23):
        risky.append(p)
print(risky)`]
 ],
 real:["On the job","A vulnerability scanner returns 500 findings. A loop that keeps only the critical ones on internet-facing hosts gives you a short list to fix first."],
 myth:["`range(1, 5)` includes 5.","The stop value is excluded, so `range(1, 5)` gives 1 to 4. For ports 1 to 1024, write `range(1, 1025)`."],
 tryit:{h:"Loop over hosts", where:"Kali: python3",
  p:"Loop over your lab addresses and print a line for each. Then change it to skip the Kali address.",
  code:String.raw`hosts = ["10.10.10.10", "10.10.10.20"]
for h in hosts:
    print("would scan", h)`},
 quiz:[
  {d:1, run:true, q:"What does this print?", code:String.raw`ports = [22, 80, 443]
print(ports[1])`, o:["80","22","443"], k:0,
   w:"Index 1 is the second item, because counting starts at 0."},
  {d:2, run:true, q:"What does this print?", code:String.raw`print(list(range(1, 4)))`, o:["[1, 2, 3]","[1, 2, 3, 4]","[0, 1, 2, 3]"], k:0,
   w:"The start is included and the stop is not."},
  {d:2, run:true, q:"What does this print?", code:String.raw`total = 0
for n in [3, 4, 5]:
    total = total + n
print(total)`, o:["12","5","345"], k:0,
   w:"The loop adds each number to the running total: 3, then 7, then 12."}
 ],
 recap:["Lists hold ordered items; indexes start at 0.","for loops run once per item.","`range(a, b)` stops before b.","Loop plus if filters a list."]},

{t:"Dictionaries and counting",
 sub:"Look things up by name, and count what you see.",
 learn:[
  ["Dictionaries","A dictionary maps keys to values, in curly braces. Look a value up by its key, the way DNS looks up an address by name.", String.raw`services = {22: "ssh", 80: "http", 443: "https"}
print(services[443])`],
  ["Safe lookups","Looking up a missing key with square brackets raises a KeyError. `.get(key, default)` returns the default instead, which is safer with messy data."],
  ["Counting by hand","To count things, add 1 to a dictionary value each time you see a key. Start missing keys at 0 with `.get()`.", String.raw`counts = {}
for ip in ["1.1.1.1", "2.2.2.2", "1.1.1.1"]:
    counts[ip] = counts.get(ip, 0) + 1
print(counts)`],
  ["Counter does it for you","`collections.Counter` counts a list in one line, and `.most_common(n)` gives the top n. It's perfect for top talkers and top failed-login sources.", String.raw`from collections import Counter
fails = ["1.1.1.1", "2.2.2.2", "1.1.1.1"]
print(Counter(fails).most_common(1))`]
 ],
 real:["On the job","“Which IPs failed to log in the most last night?” is a daily SOC question. Read the log, pull out the IPs, put them in a Counter, print `most_common(10)`. Done."],
 myth:["Dictionaries are only for advanced code.","They're one of the most useful beginner tools: look-up tables, counts and parsed JSON are all dictionaries."],
 tryit:{h:"Count top talkers", where:"Kali: python3",
  p:"Count how often each IP appears and print the top two.",
  code:String.raw`from collections import Counter
ips = ["10.10.10.20", "10.10.10.30", "10.10.10.20", "8.8.8.8", "10.10.10.20"]
for ip, n in Counter(ips).most_common(2):
    print(ip, n)`},
 quiz:[
  {d:1, run:true, q:"What does this print?", code:String.raw`services = {22: "ssh", 80: "http"}
print(services.get(443, "unknown"))`, o:["unknown","None","A KeyError"], k:0,
   w:"443 isn't a key, so `.get()` returns the default you gave it."},
  {d:2, run:true, q:"What does this print?", code:String.raw`from collections import Counter
print(Counter(["a", "b", "a"]).most_common(1))`, o:["[('a', 2)]","{'a': 2}","a"], k:0,
   w:"`most_common` returns a list of (item, count) pairs, highest first."},
  {d:2, q:"Why use `counts.get(ip, 0) + 1` instead of `counts[ip] + 1`?", o:["The first time an IP appears it isn't a key yet","It runs faster","It sorts the dictionary"], k:0,
   w:"Square brackets on a missing key raise a KeyError. `.get` starts new keys at 0."}
 ],
 recap:["Dictionaries map keys to values.","`.get(key, default)` avoids KeyErrors.","Count with `.get(k, 0) + 1`, or use Counter.","`most_common(n)` gives the top n."]},

{t:"Conditions and functions",
 sub:"Make decisions, then package code you'll reuse.",
 learn:[
  ["if, elif, else","An if runs its block only when the condition is true. elif checks the next condition and else catches everything left. Only the first matching branch runs.", String.raw`fails = 7
if fails > 10:
    print("block")
elif fails > 5:
    print("warn")
else:
    print("ok")`],
  ["Comparisons","`==` means equal and `!=` means not equal. `<`, `>`, `<=` and `>=` compare numbers. Combine conditions with `and`, `or` and `not`. A single `=` assigns; it never compares."],
  ["Functions","`def` defines a function: a named block you can call again and again. Parameters go in the brackets, and `return` sends a result back.", String.raw`def is_admin_port(port):
    return port in (22, 3389, 5985)

print(is_admin_port(3389))`],
  ["Why functions matter","Functions stop you copying code around. Fix a bug once and every caller gets the fix. They also make scripts easier to test and read."]
 ],
 real:["On the job","Detection rules are functions in disguise: given an event, return True if it's suspicious. Writing small functions like `is_off_hours(timestamp)` is exactly how SIEM and SOAR logic is built."],
 myth:["A function that prints a result returns it too.","print shows a value on screen; return hands it back to the caller. A function without return gives back None."],
 tryit:{h:"Write a tiny rule", where:"Kali: python3",
  p:"Write a function that flags a login as suspicious after more than five failures, then test it with a few values.",
  code:String.raw`def suspicious(fails):
    return fails > 5

for n in [2, 6, 11]:
    print(n, suspicious(n))`},
 quiz:[
  {d:1, run:true, q:"What does this print?", code:String.raw`fails = 7
if fails > 10:
    print("block")
elif fails > 5:
    print("warn")
else:
    print("ok")`, o:["warn","block","ok"], k:0,
   w:"7 isn't over 10, but it is over 5, so the elif branch runs."},
  {d:2, run:true, q:"What does this print?", code:String.raw`def risk(likelihood, impact):
    return likelihood * impact

print(risk(3, 4))`, o:["12","7","34"], k:0,
   w:"The function multiplies its two arguments and returns 12."},
  {d:3, q:"What does this print?", code:String.raw`def check(port):
    print("checked", port)

result = check(22)
print(result)`, o:["checked 22, then None","checked 22, then 22","None only"], k:0,
   w:"The function prints but never returns, so `result` is None."}
 ],
 recap:["if, elif and else choose a branch.","`==` compares; `=` assigns.","`def` packages code; `return` hands back a result.","Small functions make detection logic readable."]},

{t:"Reading files and logs",
 sub:"Where most security scripts start.",
 learn:[
  ["Open with with","`with open(path) as f:` opens a file and closes it automatically when the block ends, even if an error happens. Use it every time.", String.raw`with open("ssh.log") as f:
    for line in f:
        print(line.strip())`],
  ["Line by line","Looping over a file gives one line at a time, so even a huge log fits in memory. Each line ends with a newline, which `.strip()` removes."],
  ["Writing files","Open with \"w\" to write a new file, which replaces anything already there. Use \"a\" to append. Writing your results to a file makes them easy to attach to a ticket."],
  ["Messy logs","Real logs contain odd characters. `open(path, errors=\"replace\")` swaps unreadable bytes for a placeholder instead of crashing halfway through."]
 ],
 real:["On the job","An incident responder receives a 2 GB web server log. Opening it in Notepad hangs the laptop. A Python loop reads it line by line, keeps only requests from the suspect IP and writes them to a small file."],
 myth:["You must load the whole file before searching it.","Looping over the file object reads one line at a time. That's faster to start and works on files bigger than your RAM."],
 tryit:{h:"Count failed SSH logins", where:"Kali terminal",
  p:"SSH isn't running on Kali by default. Start it, fail a login, export the log, then count the failures with Python.",
  code:String.raw`sudo systemctl start ssh
ssh nobody@localhost    # type yes, a wrong password, then Ctrl+C
sudo journalctl -u ssh > ssh.log
python3 -c '
count = 0
with open("ssh.log", errors="replace") as f:
    for line in f:
        if "Failed password" in line:
            count += 1
print(count, "failed logins")
'
sudo systemctl stop ssh`},
 quiz:[
  {d:1, q:"What does `with open(...) as f:` give you that plain `open()` doesn't?", o:["The file closes automatically when the block ends","The file opens faster","The file is encrypted"], k:0,
   w:"The with block guarantees the file is closed, even if an error interrupts it."},
  {d:2, q:"You open report.txt with mode \"w\". What happens to what was already in it?", o:["It's replaced","New text is added to the end","Python refuses to open it"], k:0,
   w:"\"w\" truncates the file. Use \"a\" to append instead."},
  {d:2, q:"Why loop over a log file line by line instead of reading it all at once?", o:["It handles files bigger than memory","It sorts the lines","It removes duplicate lines"], k:0,
   w:"Only one line is held at a time, so file size stops mattering."}
 ],
 recap:["Always open files with `with`.","Loop over the file to read line by line.","\"w\" replaces; \"a\" appends.","`errors=\"replace\"` survives messy logs."]},

{t:"Regular expressions",
 sub:"Find patterns, not just fixed text.",
 learn:[
  ["What regex is","A regular expression is a pattern that matches text. Python's `re` module uses it to find IP addresses, usernames or error codes inside messy lines. Write patterns as raw strings, like `r\"...\"`."],
  ["Building blocks","`\\d` matches a digit and `\\S` any non-whitespace character. `+` means one or more. `.` matches any character, so escape it as `\\.` when you mean a real dot."],
  ["Capture groups","Brackets capture part of a match. `re.search` returns a match object, and `.group(1)` gives you what the first brackets captured.", String.raw`import re
line = "Failed password for root from 10.0.0.5 port 22"
m = re.search(r"from (\S+)", line)
if m:
    print(m.group(1))`],
  ["findall","`re.findall` returns every match in the text as a list. It's the quickest way to pull all the IP addresses or numbers out of a line."]
 ],
 real:["On the job","Threat intel reports list indicators like IPs and domains buried in paragraphs. A regex pulls them out in seconds so they can be blocked or searched for in your SIEM."],
 myth:["You need to memorise regex syntax.","Nobody does. Learn the few building blocks here, then test patterns on a site like regex101 or in the Python prompt."],
 tryit:{h:"Extract IPs from text", where:"Kali: python3",
  p:"Pull every IPv4-looking address out of a block of text. The pattern is simple, so it can match impossible values like 999.1.1.1; real tools also validate.",
  code:String.raw`import re
text = "Blocked 10.10.10.10 and 203.0.113.7; allowed 10.10.10.20"
print(re.findall(r"\d+\.\d+\.\d+\.\d+", text))`},
 quiz:[
  {d:2, run:true, q:"What does this print?", code:String.raw`import re

{t:"Hashing and encoding",
 sub:"Fingerprints, file checks and why Base64 isn't security.",
 learn:[
  ["hashlib","Python's `hashlib` computes hashes like SHA-256. Hash functions work on bytes, so encode text first with `.encode()`. `.hexdigest()` gives the familiar hex string.", String.raw`import hashlib
print(hashlib.sha256("hello".encode()).hexdigest())`],
  ["Hashing a file","Read the file in binary mode and feed it to the hash in chunks, so large files don't fill memory. Compare the result with the publisher's hash to check integrity."],
  ["Encoding isn't encryption","Base64 turns bytes into safe text for email or URLs. Anyone can reverse it with no key. Seeing Base64 in a script or config means obscured, not protected."],
  ["Passwords need more","SHA-256 is too fast for storing passwords. Use a slow, salted algorithm such as Argon2 or bcrypt, through a library like argon2-cffi. Never write your own."]
 ],
 real:["On the job","Malware analysts share file hashes, not files. Searching a SHA-256 in a threat intel service tells you in seconds whether a suspicious attachment is already known to be malicious."],
 myth:["Base64 hides secrets.","Base64 is encoding: one line of Python reverses it. Attackers use it to dodge simple text filters, not to protect anything."],

  p:"Hash any file and compare the result with `sha256sum` on the same file. They should match exactly.",
  code:String.raw`import hashlib, sys
h = hashlib.sha256()
with open(sys.argv[1], "rb") as f:
    for chunk in iter(lambda: f.read(65536), b""):
        h.update(chunk)
print(h.hexdigest())
# run: python3 hashfile.py /etc/hostname
# compare: sha256sum /etc/hostname`},

  {d:2, run:true, q:"What does this print?", code:String.raw`import hashlib
print(len(hashlib.sha256(b"x").hexdigest()))`, o:["64","32","256"], k:0,
   w:"SHA-256 is 256 bits, which is 32 bytes, which is 64 hex characters."},

print(base64.b64decode("aGk=").decode())`, o:["hi","aGk=","An error, because you need a key"], k:0,
   w:"No key needed. That's why Base64 is encoding, not encryption."},
  {d:1, q:"Which should you use to store user passwords?", o:["Argon2 or bcrypt","SHA-256 on its own","Base64"], k:0,
   w:"Password hashes must be slow and salted so stolen hashes are expensive to crack."}
 ],

{t:"Sockets and port checks",
 sub:"Talk to the network directly, in your lab only.",
 learn:[
  ["The socket module","A socket is one end of a network connection. `socket.socket()` makes a TCP socket, and `connect_ex((host, port))` tries to connect. It returns 0 when the port is open."],
  ["Always set a timeout","Without a timeout, a filtered port can hang your script for a long time. `s.settimeout(1)` gives up after a second. Close each socket when you're done with it."],
  ["A tiny port check","Loop over a few ports and report the open ones. This is a TCP connect check: the full handshake completes, unlike Nmap's SYN scan.", String.raw`import socket
host = "10.10.10.20"
for port in [22, 135, 445, 3389]:
    s = socket.socket()
    s.settimeout(1)
    if s.connect_ex((host, port)) == 0:
        print(port, "open")
    s.close()`],
  ["Permission still applies","A Python scanner is still a scanner. Only point it at systems you own or have written permission to test. Your internal lab is fine."]
 ],
 real:["On the job","Tools like Nmap are better for real scanning. But a 10-line socket check is perfect inside automation, for example confirming a service came back up after a patch or that a port is closed after a firewall change."],
 myth:["Writing your own scanner makes you stealthier than Nmap.","A connect scan completes the handshake, so it's noisier than a SYN scan and easily logged. Use Python for automation, not stealth."],
 tryit:{h:"Check your target's ports", where:"Kali, against the Windows target",
  p:"Save the learn card's code as portcheck.py and run it. Then compare the result with `sudo nmap -sS -p 22,135,445,3389 10.10.10.20`.",
  code:String.raw`python3 portcheck.py
sudo nmap -sS -p 22,135,445,3389 10.10.10.20`},
 quiz:[
  {d:1, q:"What does `connect_ex` return when a port is open?", o:["0","1","True"], k:0,
   w:"It returns an error number, and 0 means no error: the connection succeeded."},
  {d:2, q:"Why call `s.settimeout(1)` before connecting?", o:["So filtered ports don't hang the script","To make the connection encrypted","To scan UDP instead"], k:0,
   w:"A firewall that silently drops packets never answers. The timeout stops your script waiting."},
  {d:2, q:"How does this Python check differ from `nmap -sS`?", o:["It completes the full TCP handshake","It never sends a SYN","It only works on UDP"], k:0,
   w:"connect_ex does a full connect. Nmap's -sS sends SYN and never completes the handshake."}
 ],
 recap:["`connect_ex` returns 0 for an open port.","Always set a timeout and close sockets.","A connect check completes the handshake.","Lab or written permission only."]},

{t:"Errors and arguments",
 sub:"Scripts that handle bad input and take options.",
 learn:[
  ["Exceptions","When something goes wrong, Python raises an exception, like FileNotFoundError or ValueError. Unhandled, it stops the script with a traceback."],
  ["try and except","Wrap risky code in try, and handle a specific exception in except. Catch the errors you expect; a bare `except:` hides real bugs.", String.raw`try:
    port = int("ssh")
except ValueError:
    print("not a port number")`],
  ["Fail safely","If a security check can't complete, decide what happens. A function that returns True for “allowed” when it hits an error is failing open, which is OWASP 2025 A10. Default to deny."],
  ["Command-line arguments","`argparse` turns `python3 tool.py ssh.log --threshold 5` into named values, with help text for free. It makes a script reusable without editing the code.", String.raw`import argparse
p = argparse.ArgumentParser(description="Count failed logins")
p.add_argument("logfile")
p.add_argument("--threshold", type=int, default=5)
args = p.parse_args()
print(args.logfile, args.threshold)`]
 ],
 real:["On the job","A scheduled script crashes at 3am because one log line is malformed, and nobody notices for a week. Handling the expected error, logging it and carrying on keeps monitoring alive."],
 myth:["Catching every exception with a bare except is the safe choice.","It hides bugs and can even catch Ctrl+C. Catch the specific errors you expect and let real problems surface."],
 tryit:{h:"Make it robust", where:"Kali: save as safe_read.py",
  p:"Run it with a file that exists, then with one that doesn't, and see the difference.",
  code:String.raw`import sys
try:
    with open(sys.argv[1]) as f:
        print(sum(1 for _ in f), "lines")
except FileNotFoundError:
    print("No such file:", sys.argv[1])
    sys.exit(1)
# python3 safe_read.py /etc/hostname
# python3 safe_read.py nope.log`},
 quiz:[
  {d:1, run:true, q:"What does this print?", code:String.raw`try:
    port = int("ssh")
    print("port", port)
except ValueError:
    print("bad input")`, o:["bad input","port ssh","A traceback"], k:0,
   w:"`int(\"ssh\")` raises ValueError, so the except block runs instead."},
  {d:3, q:"An access check hits a database error and returns True. What's wrong?", o:["It fails open, so errors grant access","It's too slow","It logs too much"], k:0,
   w:"When a check can't finish, deny by default. Failing open turns an outage into a breach."},
  {d:2, q:"What does argparse give you?", o:["Named command-line options with built-in help","Faster loops","Automatic encryption"], k:0,
   w:"Users can change inputs without editing the code, and `--help` documents the options."}
 ],

{t:"Cloud checks with boto3",
 sub:"Use Python to audit an AWS account.",
 learn:[
  ["What boto3 is","boto3 is the official AWS SDK for Python. On Kali, install it with `sudo apt install python3-boto3`, because plain pip is blocked outside a virtual environment. Cloud security teams use it to audit settings across many accounts and services."],
  ["Credentials","boto3 finds credentials from `aws configure`, environment variables or an IAM role. Never put access keys in your code. Use a read-only role for audits, following least privilege."],
  ["Asking AWS questions","A client object exposes API calls as methods. Responses are dictionaries, the same as parsed JSON.", String.raw`import boto3
s3 = boto3.client("s3")
for b in s3.list_buckets()["Buckets"]:
    print(b["Name"])`],
  ["Handle missing settings","Some calls raise ClientError when a setting doesn't exist, such as a bucket with no public access block. Check the error code, so a permissions problem isn't mistaken for a missing setting."]
 ],
 real:["On the job","Misconfigured cloud storage is behind many data exposures, and it's OWASP 2025 A02. A short boto3 script that flags buckets without a public access block is a classic cloud security interview project."],
 myth:["A script that finds no problems proves the account is safe.","It only checks what you wrote it to check. Account-level settings, bucket policies and ACLs all affect public access too. Treat scripts as one layer."],
 tryit:{h:"Flag S3 buckets to review", where:"Your own AWS account, read-only role",
  p:"New buckets have blocked public access by default since April 2023, so REVIEW usually means an older bucket. Account-level settings also apply. Use your own account, never an employer's without approval.",
  code:String.raw`import boto3
from botocore.exceptions import ClientError
s3 = boto3.client("s3")
for b in s3.list_buckets()["Buckets"]:
    name = b["Name"]
    try:
        cfg = s3.get_public_access_block(Bucket=name)
        ok = all(cfg["PublicAccessBlockConfiguration"].values())
    except ClientError as e:
        if e.response["Error"]["Code"] != "NoSuchPublicAccessBlockConfiguration":
            print("ERROR ", name, e.response["Error"]["Code"])
            continue
        ok = False
    print("OK    " if ok else "REVIEW", name)`},
 quiz:[
  {d:1, q:"Where should a boto3 script get its AWS credentials?", o:["From aws configure, environment variables or an IAM role","Hard-coded at the top of the script","From a comment in the code"], k:0,
   w:"Hard-coded keys leak through repos and screenshots. Let boto3 find credentials outside the code."},
  {d:2, q:"Why give an audit script a read-only role?", o:["If the script or key leaks, it can't change anything","Read-only roles run faster","AWS requires it"], k:0,
   w:"Least privilege limits the damage from a compromised script or credential."},
  {d:2, q:"In the Try it script, what does a NoSuchPublicAccessBlockConfiguration error mean?", o:["The bucket has no bucket-level public access block, so review it","The bucket is definitely public","The bucket was deleted"], k:0,
   w:"No block at bucket level doesn't prove it's public, but it means you should check the account settings and bucket policy. Other codes, like AccessDenied, mean a permissions problem instead."}
 ],

{t:"Capstone: a brute-force detector",
 sub:"Put the whole track together in one tool.",
 learn:[
  ["The goal","Read an SSH log, find failed logins, count them per source IP and print the IPs over a threshold. It uses files, regex, Counter, functions, error handling and argparse."],
  ["The plan","Break it into steps before writing code: get arguments, open the file safely, match each line, count, then report. Each step is a few lines you already know."],
  ["The core","The heart of the tool is a loop with a regex and a Counter.", String.raw`import re
from collections import Counter
pattern = re.compile(r"Failed password .* from (\S+)")
counts = Counter()
for line in ["Failed password for root from 10.0.0.5 port 22 ssh2"]:
    m = pattern.search(line)
    if m:
        counts[m.group(1)] += 1
print(counts)`],
  ["Make it yours","Once it works, extend it: add a `--top` option, flag failures followed by a success from the same IP, or output JSON for a SIEM. Then write it up on GitHub."]
 ],
 real:["On the job","Interviewers love a small, working tool you can explain line by line. “I wrote a script that finds brute-force sources in SSH logs” shows Python, log analysis and security thinking at once."],
 myth:["Portfolio projects have to be big to count.","A small tool with a clear README, sample output and an honest list of limitations beats an unfinished large one."],
 tryit:{h:"Build the detector", where:"Kali: save as bruteforce.py",
  p:"Start SSH, fail a few logins with `ssh nobody@localhost`, then run `sudo journalctl -u ssh > ssh.log` and `python3 bruteforce.py ssh.log --threshold 2`. Stop SSH afterwards.",
  code:String.raw`import argparse, re, sys
from collections import Counter

p = argparse.ArgumentParser(description="Find brute-force sources in an SSH log")
p.add_argument("logfile")
p.add_argument("--threshold", type=int, default=3)
args = p.parse_args()

pattern = re.compile(r"Failed password .* from (\S+)")
counts = Counter()
try:
    with open(args.logfile, errors="replace") as f:
        for line in f:
            m = pattern.search(line)
            if m:
                counts[m.group(1)] += 1
except FileNotFoundError:
    sys.exit(f"No such file: {args.logfile}")

for ip, n in counts.most_common():
    if n >= args.threshold:
        print(f"{ip}: {n} failed logins")`},
 quiz:[
  {d:2, q:"Which part of the detector pulls the source IP out of each line?", o:["The regex capture group","The Counter","argparse"], k:0,
   w:"`(\\S+)` after \"from \" captures the IP, and `.group(1)` returns it."},
  {d:2, q:"Why compile the regex once with `re.compile` outside the loop?", o:["It avoids re-processing the pattern on every line","It makes the regex case-insensitive","It's required for capture groups"], k:0,
   w:"Python caches patterns anyway, but compiling once is clearer and avoids repeated work on huge logs."},
  {d:3, q:"Which extension would best catch a successful brute-force attack?", o:["Flag an IP with many failures followed by a success","Print the log in colour","Sort IPs alphabetically"], k:0,
   w:"Many failures then a success from the same source is a classic sign that a password was guessed."}
 ],
 recap:["Plan the steps, then code each one.","Regex extracts, Counter counts, argparse configures.","Handle missing files cleanly.","Write it up on GitHub with sample output."]}
];
/* ==========================================================================
   APP
   ========================================================================== */
const initialHash = location.hash; // read before any tab renders and rewrites it
const store = {
  ok: (() => { try { localStorage.setItem("cr2-test", "1"); localStorage.removeItem("cr2-test"); return true; } catch(e){ return false; } })(),
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const asObj = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};

const LEVEL = {1:"Easy", 2:"Medium", 3:"Hard"};
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function codeHtml(src){ return src.split("\n").map(l => `<span style="--i:${l.match(/^ */)[0].length}"${/^\s*#/.test(l) ? ' class="c"' : ""}>${esc(l)}</span>`).join(""); }
function codeBlock(src, where, copy){
  return `<div class="code">${copy || where ? `<div class="ch"><span class="where">${esc(where || "")}</span>${copy ? `<button class="cp" type="button">Copy</button>` : ""}</div>` : ""}<pre><code>${codeHtml(src)}</code></pre></div>`;
}
function wireCopy(scope, text){
  const cp = scope.querySelector(".cp");
  if (!cp) return;
  let timer = null;
  const show = (label, said) => { clearTimeout(timer); cp.textContent = label; live.textContent = said; timer = setTimeout(() => cp.textContent = "Copy", 1600); };
  cp.addEventListener("click", () => {
    const pre = cp.closest(".code").querySelector("pre");
    const fallback = () => {
      // Clipboard blocked: select the code so a long-press can copy it.
      try { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch(e){}
      show("Selected", "Code selected. Long-press to copy.");
    };
    try { navigator.clipboard.writeText(text).then(() => show("Copied", "Code copied"), fallback); }
    catch(e){ fallback(); }
  });
}
// Two taps to confirm, inside the page (some hosts block confirm() dialogs).
function twoTap(btn, armedText, action){
  const label = btn.textContent; let armed = null;
  btn.addEventListener("click", () => {
    if (!armed){ btn.textContent = armedText; armed = setTimeout(() => { armed = null; btn.textContent = label; }, 4000); return; }
    clearTimeout(armed); armed = null; action();
    btn.textContent = "Done"; setTimeout(() => btn.textContent = label, 1800);
  });
}

// Stable option shuffle per question, so the right answer isn't always in the same spot.
function seedOf(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function order(n, seed){
  const a = [...Array(n).keys()]; let x = seed || 1;
  for (let i = n - 1; i > 0; i--){ x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0; const j = x % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- Tabs and their feeds ---------- */
const TABS = {
  study:{el:document.getElementById("v-study"), cards:[], current:0, accent:"var(--t-study)"},
  feed: {el:document.getElementById("v-feed"),  cards:[], current:0, accent:"var(--t-feed)"},
  py:   {el:document.getElementById("v-py"),    cards:[], current:0, accent:"var(--t-py)"}
};
let active = "study";

function addCard(tab, {c, id, label, group, html, extra}){
  const T = TABS[tab];
  const s = el("section","card");
  s.style.setProperty("--c", c);
  if (id) s.id = id;
  s.innerHTML = `<div class="in">${html}</div>`;
  T.el.appendChild(s);
  const card = Object.assign({el:s, label, group, tab}, extra || {});
  T.cards.push(card);
  s.addEventListener("scroll", () => { if (tab === active && T.cards[T.current] === card) updateMore(); }, {passive:true});
  if (T.io) T.io.observe(s);
  return s;
}

/* A quiz card. persist: {obj, key, save} to remember the answer, or null for the feed. */
function buildQuiz(card, q, persist, onChange){
  const btns = [...card.querySelectorAll(".opt")], why = card.querySelector(".why"), retry = card.querySelector(".retry");
  const reveal = (pick, fromUser) => {
    btns.forEach(b => {
      const j = +b.dataset.j, mk = b.querySelector(".mk"), st = b.querySelector(".st");
      b.setAttribute("aria-disabled", "true");
      if (j === q.k){ b.classList.add("right"); mk.textContent = "✓"; st.textContent = j === pick ? " (your answer, correct)" : " (correct answer)"; }
      else if (j === pick){ b.classList.add("wrong"); mk.textContent = "✗"; st.textContent = " (your answer)"; }
    });
    why.innerHTML = `<strong>${pick === q.k ? "Correct." : "Not quite."}</strong> ${fmt(q.w)}`;
    why.classList.add("show");
    if (retry) retry.classList.add("show");
    if (fromUser){ why.focus({preventScroll:true}); why.scrollIntoView({block:"nearest", behavior: reduceMotion() ? "auto" : "smooth"}); }
  };
  const clear = () => {
    btns.forEach(b => { b.removeAttribute("aria-disabled"); b.classList.remove("right","wrong"); b.querySelector(".mk").textContent = ""; b.querySelector(".st").textContent = ""; });
    why.classList.remove("show"); why.innerHTML = ""; if (retry) retry.classList.remove("show");
  };
  btns.forEach(b => b.addEventListener("click", () => {
    if (b.getAttribute("aria-disabled") === "true") return;
    const pick = +b.dataset.j;
    if (persist){ persist.obj[persist.key] = pick; persist.save(); }
    reveal(pick, true);
    onChange(pick);
  }));
  if (retry) retry.addEventListener("click", () => {
    if (persist){ delete persist.obj[persist.key]; persist.save(); }
    clear(); onChange(null);
    btns[0].focus({preventScroll:true});
    card.scrollTo({top:0, behavior: reduceMotion() ? "auto" : "smooth"});
  });
  if (persist && Number.isInteger(persist.obj[persist.key])) reveal(persist.obj[persist.key], false);
  return clear;
}
function quizHtml(q, tagHtml, withRetry, seed){
  const ord = order(q.o.length, seed || seedOf(q.q + (q.code || "")));
  return `${tagHtml}
    ${q.d ? `<div class="lvl">${LEVEL[q.d]}</div>` : ""}
    <h2 class="q">${fmt(q.q)}</h2>
    ${q.code ? codeBlock(q.code, "", false) : ""}
    <div class="opts${q.code ? " out" : ""}" role="group" aria-label="Answers">${ord.map(j=>`<button class="opt" data-j="${j}"><span class="mk" aria-hidden="true"></span><span>${fmt(q.o[j])}<span class="sr st"></span></span></button>`).join("")}</div>
    <div class="why" tabindex="-1"></div>
    ${withRetry ? `<button class="btn ghost retry" type="button">Try again</button>` : ""}`;
}

/* ---------- Study and Python tracks (same card engine) ---------- */
function makeTrack(tab, items, cfg){
  const answers = asObj(store.get(cfg.answersKey, {}));
  const save = () => store.set(cfg.answersKey, answers);
  const T = TABS[tab];
  Object.assign(T, {items, cfg, answers, recapScores:{}, resetters:{}});
  T.cardCount = d => 2 + d.learn.length + (d.real ? 1 : 0) + (d.myth ? 1 : 0) + (d.tryit ? 1 : 0) + (d.review ? d.review.length : 0) + d.quiz.length;

  items.forEach((d, i) => {
    const g = cfg.groupOf(i), dn = i + 1, c = g.c;
    let n = 0;
    const make = (label, html) => { const id = cfg.id(dn, n); n++; return addCard(tab, {c, id, label, group:i, html}); };
    const tag = (kind, extra) => `<div class="tag"><span>${kind}</span>${cfg.word} ${dn}${extra ? " · " + extra : ""}</div>`;

    make("Topic", `<div class="tag"><span>${cfg.word} ${dn}</span>${esc(g.label)}</div><h1>${fmt(d.t)}</h1>
      ${d.sub ? `<p>${fmt(d.sub)}</p>` : ""}
      <div class="hint">${T.cardCount(d)} cards · ${d.quiz.length} questions · swipe up ↑</div>`);

    d.learn.forEach(([h, p, code], j) => {
      const s = make("Learn " + (j+1) + "/" + d.learn.length,
        `${tag("Learn", (j+1) + " of " + d.learn.length)}<h2>${fmt(h)}</h2><p>${fmt(p)}</p>${code ? codeBlock(code, cfg.codeLabel || "", true) : ""}`);
      if (code) wireCopy(s, code);
    });

    if (d.real) make(cfg.realLabel, `${tag(cfg.realLabel)}<h2>${fmt(d.real[0])}</h2><p>${fmt(d.real[1])}</p>`);

    if (d.myth) make("Myth vs fact", `${tag("Myth vs fact")}<h2>Don't fall for it</h2>
      <div class="mf"><div class="m"><b>Myth</b>${fmt(d.myth[0])}</div><div class="f"><b>Fact</b>${fmt(d.myth[1])}</div></div>`);

    if (d.tryit){
      const t = d.tryit;
      const s = make("Try it", `${tag("Try it")}<h2>${fmt(t.h)}</h2>${t.where && !t.code ? `<div class="where">${esc(t.where)}</div>` : ""}<p>${fmt(t.p)}</p>
        ${t.code ? codeBlock(t.code, t.where, true) : ""}`);
      if (t.code) wireCopy(s, t.code);
    }

    (d.review || []).forEach(([h, p], j) => make("Review " + (j+1) + "/" + d.review.length,
      `${tag("Review", (j+1) + " of " + d.review.length)}<h2>${fmt(h)}</h2><p>${fmt(p)}</p>`));

    T.resetters[dn] = [];
    d.quiz.forEach((q, qi) => {
      const s = make("Quiz " + (qi+1) + "/" + d.quiz.length, quizHtml(q, tag("Quiz", (qi+1) + " of " + d.quiz.length), true));
      T.resetters[dn].push(buildQuiz(s, q, {obj:answers, key:dn + "." + qi, save}, pick => updateScore(tab, pick !== null)));
    });

    const last = dn === items.length;
    const rc = make("Recap", `${tag("Recap")}<h2>${last ? cfg.lastRecap : cfg.word + " " + dn + " in a nutshell"}</h2>
      <ul class="recap">${d.recap.map(r => `<li>${fmt(r)}</li>`).join("")}</ul>
      <div class="dscore"></div>
      <div class="row"><button class="btn nx">${last ? "Finish" : "Start " + cfg.word + " " + (dn+1)}</button><button class="btn ghost redo" type="button">Redo this quiz</button></div>`);
    T.recapScores[dn] = rc.querySelector(".dscore");
    rc.querySelector(".nx").addEventListener("click", () => last ? go(tab, T.cards.length-1) : goGroup(tab, dn));
    rc.querySelector(".redo").addEventListener("click", () => {
      d.quiz.forEach((q, qi) => delete answers[dn + "." + qi]);
      save();
      T.resetters[dn].forEach(f => f());
      updateScore(tab, false);
      go(tab, T.cards.findIndex(c => c.group === i && c.label.startsWith("Quiz 1/")));
    });
  });
}
function trackStats(tab, dn){
  const T = TABS[tab], d = T.items[dn-1]; let done = 0, right = 0;
  d.quiz.forEach((q, qi) => { const a = T.answers[dn + "." + qi]; if (Number.isInteger(a)){ done++; if (a === q.k) right++; } });
  return {done, right, total: d.quiz.length};
}
function trackTotals(tab){
  const T = TABS[tab]; let done = 0, right = 0, total = 0;
  T.items.forEach((d, i) => { const s = trackStats(tab, i+1); done += s.done; right += s.right; total += s.total; });
  return {done, right, total};
}

/* ---------- Feed tab: endless, shuffled decks ---------- */
const F = TABS.feed;
const feedState = (() => {
  const s = asObj(store.get("cr2-feed", {}));
  return {seen:asObj(s.seen), scored:asObj(s.scored), recent:Array.isArray(s.recent) ? s.recent : [], decks:+s.decks || 0, answered:+s.answered || 0, right:+s.right || 0};
})();
const saveFeed = () => store.set("cr2-feed", feedState);
const DECK_COLOUR = {owasp:"var(--t-feed)", incident:"var(--w4)"};
let feedSerial = 0, lastKind = null, decksAppended = 0;
function pickDeck(){
  // Skip recently shown decks, alternate OWASP and incident decks, and favour the least-seen ones.
  const avoid = feedState.recent.slice(-Math.min(6, FEED_DECKS.length - 1));
  let pool = FEED_DECKS.filter(d => !avoid.includes(d.id));
  const other = pool.filter(d => d.kind !== lastKind);
  if (other.length) pool = other;
  const min = Math.min(...pool.map(d => feedState.seen[d.id] || 0));
  const least = pool.filter(d => (feedState.seen[d.id] || 0) === min);
  return least[Math.floor(Math.random() * least.length)];
}
function appendDeck(){
  const d = pickDeck(); lastKind = d.kind;
  feedState.recent.push(d.id); feedState.recent = feedState.recent.slice(-30); saveFeed();
  const c = DECK_COLOUR[d.kind], badge = d.kind === "owasp" ? "OWASP " + d.tag : "Incident " + d.tag;
  const name = d.kind === "owasp" ? d.tag + " " + d.title : d.title + " " + d.tag;
  const total = d.cards.length + 1, serial = ++feedSerial;
  const tag = (i, extra) => `<div class="tag"><span>${esc(badge)}</span>${esc(d.title)} · ${extra || (i+1) + " of " + total}</div>`;
  d.cards.forEach(([h, p], i) => {
    const last = i === d.cards.length - 1;
    addCard("feed", {c, label:name, group:serial, extra:{deck:d.id, pos:i, total, first:i === 0},
      html:`${tag(i)}<h2>${fmt(h)}</h2><p>${fmt(p)}</p>${last && d.maps ? `<div class="chip"><b>Maps to</b>${fmt(d.maps)}</div>` : ""}`});
  });
  const s = addCard("feed", {c, label:"Check · " + name, group:serial, extra:{deck:d.id, pos:d.cards.length, total}, html: quizHtml(d.q, tag(0, "Check"), false, Math.random() * 4294967296 >>> 0)});
  buildQuiz(s, d.q, null, pick => {
    if (pick === null) return;
    // Count each deck's check once per day, so repeats don't inflate the score.
    const today = new Date().toLocaleDateString("en-CA");
    if (feedState.scored[d.id] === today) return;
    feedState.scored[d.id] = today; feedState.answered++; if (pick === d.q.k) feedState.right++;
    saveFeed(); updateScore("feed", true);
  });
  // A natural pause every five decks, so the Feed isn't a bottomless scroll.
  if (++decksAppended % 5 === 0){
    const pause = addCard("feed", {c:"var(--t-feed)", label:"Pause", group:serial, extra:{pause:true}, html:`
      <div class="tag"><span>Pause</span>${decksAppended} decks in this session</div>
      <h2>Nice run</h2>
      <p class="runScore"></p>
      <div class="row"><button class="btn keep" type="button">Keep going</button><button class="btn ghost toStudy" type="button">Switch to Study</button></div>`});
    pause.querySelector(".keep").addEventListener("click", () => go("feed", F.cards.findIndex(c => c.el === pause) + 1));
    pause.querySelector(".toStudy").addEventListener("click", () => userSwitch("study"));
  }
}
addCard("feed", {c:"var(--t-feed)", id:"feed-start", label:"Start", group:-1, html:`
  <div class="tag"><span>Feed</span>Never ends</div>
  <h1>Keep scrolling</h1>
  <p>OWASP Top 10:2025 categories and real incidents, mixed and shuffled. Each deck ends with a quick check.</p>
  <p class="small"><b style="color:var(--t-feed)">Pink</b> decks are OWASP categories. <b style="color:var(--w4)">Orange</b> decks are real incidents.</p>
  <div class="hint">${FEED_DECKS.length} decks · swipe up ↑</div>`});
for (let i = 0; i < 3; i++) appendDeck();

// Keep the DOM small on long sessions: drop whole decks well above the reader,
// but only once scrolling has settled, so a fling isn't interrupted.
let trimTimer = null;
function scheduleTrim(){ clearTimeout(trimTimer); trimTimer = setTimeout(trimFeed, 900); }
F.el.addEventListener("scroll", () => { if (trimTimer){ clearTimeout(trimTimer); trimTimer = setTimeout(trimFeed, 900); } }, {passive:true});
function trimFeed(){
  trimTimer = null;
  if (F.cards.length < 90 || F.current < 50) return;
  // Decks are contiguous, so everything before the deck holding keepFrom is whole decks.
  const keepFrom = F.current - 25, g = F.cards[keepFrom].group;
  const cut = F.cards.findIndex(c => c.group === g);
  if (cut <= 0) return;
  const removed = F.cards.splice(0, cut);
  const h = removed.reduce((sum, c) => sum + c.el.offsetHeight, 0);
  removed.forEach(c => { F.io.unobserve(c.el); c.el.remove(); });
  F.el.scrollTop -= h;
  F.current -= cut;
}

/* ---------- Header, progress and the "more below" hint ---------- */
const prog = document.getElementById("prog"), where = document.getElementById("where"), count = document.getElementById("count");
const more = document.getElementById("more"), live = document.getElementById("live");
const sheet = document.getElementById("sheet");
const hasMore = c => c.scrollHeight - c.clientHeight - c.scrollTop > 6;
function updateMore(){ const c = TABS[active].cards[TABS[active].current]; more.classList.toggle("show", !!c && !sheet.classList.contains("open") && hasMore(c.el)); }

function setCurrent(tab, idx){
  const T = TABS[tab];
  if (idx < 0) return;
  T.current = idx;
  const c = T.cards[idx];
  if (tab === "feed"){
    if (c.first && !c.counted){ c.counted = true; feedState.seen[c.deck] = (feedState.seen[c.deck] || 0) + 1; feedState.decks++; saveFeed(); }
    if (idx >= T.cards.length - 4){ appendDeck(); appendDeck(); }
    if (c.first) scheduleTrim();
  } else if (c.group >= 0){
    store.set(tab === "study" ? "cr2-pos" : "cr2-py-pos", c.el.id);
  }
  if (tab === active) render();
}
function render(){
  const T = TABS[active], c = T.cards[T.current];
  if (!c) return;
  let accent = T.accent;
  if (active === "feed"){
    accent = c.el.style.getPropertyValue("--c") || T.accent;
    prog.style.width = c.total ? ((c.pos + 1) / c.total * 100) + "%" : "0%";
    where.innerHTML = c.group >= 0 ? `<b>${esc(c.label)}</b>` : "<b>Feed</b>";
    if (location.hash !== "#feed") history.replaceState(history.state, "", "#feed");
  } else {
    prog.style.width = (T.current / (T.cards.length - 1) * 100) + "%";
    if (c.group >= 0){
      accent = c.el.style.getPropertyValue("--c") || T.accent;
      where.innerHTML = `<b>${T.cfg.word} ${c.group+1}</b> · ${esc(c.label)}`;
      // The hash names the exact card, so a reload or a restored tab comes back to the same place.
      if (location.hash !== "#" + c.el.id) history.replaceState(history.state, "", "#" + c.el.id);
    } else {
      where.textContent = active === "study" ? (c.group === -1 ? "Cyber Scroll" : "Finished") : (c.group === -1 ? "Python" : "Finished");
      const h = active === "study" ? "#study" : "#python";
      if (location.hash !== h) history.replaceState(history.state, "", h);
    }
  }
  document.documentElement.style.setProperty("--accent", accent);
  updateScore(active, false);
  updateMore();
}
function updateScore(tab, announce){
  if (tab === "feed"){
    if (active === "feed"){
      const c = F.cards[F.current];
      count.textContent = c && c.group < 0 ? `${feedState.decks} decks seen` : feedState.answered ? `${feedState.right}/${feedState.answered} right` : "No checks yet";
    }
    F.el.querySelectorAll(".runScore").forEach(r => r.textContent = feedState.answered ? `You've got ${feedState.right} of ${feedState.answered} checks right so far. Keep going, or switch to your Study plan.` : "Keep going, or switch to your Study plan.");
    if (announce) live.textContent = `${feedState.right} of ${feedState.answered} feed checks right`;
    return;
  }
  const T = TABS[tab];
  T.items.forEach((d, i) => {
    const s = trackStats(tab, i+1), r = T.recapScores[i+1];
    if (r) r.innerHTML = s.done ? `Quiz: <b>${s.right} of ${s.total}</b> right${s.done < s.total ? ` · ${s.total - s.done} unanswered` : ""}` : `Quiz: not answered yet`;
  });
  const t = trackTotals(tab);
  if (tab === active) count.textContent = `${t.right}/${t.done} correct`;
  if (announce) live.textContent = `${t.right} of ${t.done} correct so far`;
  const es = T.el.querySelector(".endScore");
  if (es) es.textContent = t.done ? `You got ${t.right} of ${t.done} questions right${t.done < t.total ? `, with ${t.total - t.done} still to do` : ""}.` : "You haven't answered any questions yet.";
  if (sheet.classList.contains("open")) renderSheet();
}

Object.entries(TABS).forEach(([tab, T]) => {
  T.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setCurrent(tab, T.cards.findIndex(c => c.el === e.target)); }), {root:T.el, threshold:0.6});
  T.cards.forEach(c => T.io.observe(c.el));
});

/* ---------- Navigation ---------- */
function go(tab, idx){
  const T = TABS[tab];
  idx = Math.max(0, Math.min(T.cards.length-1, idx));
  // Smooth for a step or two; instant for long jumps so pickers don't scroll through hundreds of cards.
  const smooth = tab === active && Math.abs(idx - T.current) <= 2 && !reduceMotion();
  T.cards[idx].el.scrollIntoView({behavior: smooth ? "smooth" : "auto"});
}
function goGroup(tab, i){ go(tab, TABS[tab].cards.findIndex(c => c.group === i)); }
// Next and the down keys finish reading a tall card before moving on.
function next(){
  const T = TABS[active], c = T.cards[T.current].el;
  if (hasMore(c)) c.scrollBy({top: c.clientHeight * 0.8, behavior: reduceMotion() ? "auto" : "smooth"});
  else go(active, T.current + 1);
}
function prev(){
  const T = TABS[active], c = T.cards[T.current].el;
  if (c.scrollTop > 6) c.scrollBy({top: -c.clientHeight * 0.8, behavior: reduceMotion() ? "auto" : "smooth"});
  else go(active, T.current - 1);
}

function switchTab(tab, focusView){
  if (!TABS[tab]) tab = "study";
  active = tab;
  Object.entries(TABS).forEach(([k, T]) => {
    const on = k === tab;
    T.el.classList.toggle("off", !on);
    T.el.inert = !on;
    const b = document.getElementById("tab-" + k);
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
  });
  store.set("cr2-tab", tab);
  const pickWrap = document.getElementById("pickWrap");
  pickWrap.hidden = tab === "feed";
  document.getElementById("pickLabel").textContent = tab === "py" ? "Lessons" : "Days";
  document.getElementById("openDays").setAttribute("aria-label", tab === "py" ? "Choose a lesson" : "Choose a day");
  render();
  if (focusView) TABS[tab].el.focus({preventScroll:true});
}
// Leaving Study adds one history entry, so the phone's Back button returns to Study instead of closing the app.
function userSwitch(tab){
  if (tab === active){
    // Re-tapping the current tab: Study and Python go to their start card, the Feed skips to the next deck.
    if (tab === "feed"){ const i = F.cards.findIndex((c, j) => j > F.current && c.first); go("feed", i > 0 ? i : F.current + 1); }
    else go(tab, 0);
    return;
  }
  const onTabEntry = history.state && history.state.tab;
  if (tab === "study"){ if (onTabEntry){ history.back(); return; } switchTab("study"); return; }
  if (!onTabEntry) history.pushState({tab:1}, "", location.hash);
  switchTab(tab);
}
document.querySelectorAll(".tab").forEach(b => {
  b.addEventListener("click", () => userSwitch(b.dataset.tab));
  b.addEventListener("keydown", e => {
    const order = ["study","feed","py"], i = order.indexOf(b.dataset.tab);
    const target = {ArrowRight:order[(i + 1) % 3], ArrowLeft:order[(i + 2) % 3], Home:order[0], End:order[2]}[e.key];
    if (target){
      e.preventDefault(); e.stopPropagation();
      userSwitch(target); document.getElementById("tab-" + target).focus();
    }
  });
});

/* ---------- Day and lesson picker. Opening it adds a history entry, so Back closes it. ---------- */
const dayList = document.getElementById("dayList"), rail = document.getElementById("rail"), tabsBar = document.getElementById("tabs");
let opener = null, afterClose = null, ignoreHash = false;
function renderSheet(){
  const tab = active === "py" ? "py" : "study", T = TABS[tab];
  const cur = T.cards[T.current] ? T.cards[T.current].group + 1 : 0;
  const groups = tab === "study"
    ? WEEKS.map((w, wi) => ({title:`Week ${w.n} · ${w.name}`, c:w.c, from:wi*7, to:wi*7+7}))
    : PY_LEVELS.map(l => ({title:l.name, c:"var(--t-py)", from:l.from, to:l.to}));
  document.getElementById("sheetTitle").textContent = tab === "py" ? "Jump to a lesson" : "Jump to a day";
  const t = trackTotals(tab);
  document.getElementById("score").textContent = `${t.done} of ${t.total} questions answered · ${t.right} correct`;
  dayList.innerHTML = groups.map(g => `<div class="wk" style="color:${g.c}">${esc(g.title)}</div><div class="days">${
    T.items.slice(g.from, g.to).map((d, j) => { const n = g.from + j + 1, s = trackStats(tab, n);
      const st = s.done === 0 ? "" : s.right < s.done ? "miss" : s.done === s.total ? "ok" : "part";
      const label = s.done ? s.right + "/" + s.total + " right" : s.total + " questions";
      return `<button class="day ${st}" style="--dc:${g.c}" data-n="${n}"${n === cur ? ' aria-current="true"' : ""}><span class="n">${n}</span><span>${esc(d.t)}<small>${label}</small></span></button>`; }).join("")
  }</div>`).join("");
  dayList.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => { const n = +b.dataset.n; closeSheet(() => goGroup(tab, n - 1)); }));
}
function openSheet(e){
  if (active === "feed") return;
  opener = (e && e.currentTarget) || document.activeElement;
  renderSheet();
  sheet.classList.add("open");
  Object.values(TABS).forEach(T => T.el.inert = true); rail.inert = true; tabsBar.inert = true;
  more.classList.remove("show");
  history.pushState({sheet:1}, "");
  const cur = dayList.querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({block:"center"});
  document.getElementById("closeDays").focus();
}
function hideSheet(){
  sheet.classList.remove("open");
  Object.entries(TABS).forEach(([k, T]) => T.el.inert = k !== active); rail.inert = false; tabsBar.inert = false;
  if (opener && opener.isConnected && opener !== document.body) opener.focus({preventScroll:true}); else TABS[active].el.focus({preventScroll:true});
  const f = afterClose; afterClose = null;
  if (f) f();
  updateMore();
}
function closeSheet(then){
  if (!sheet.classList.contains("open")) return;
  afterClose = typeof then === "function" ? then : null;
  if (history.state && history.state.sheet){
    // Going back restores the URL from before the sheet opened; ignore the hashchange that follows.
    ignoreHash = true;
    history.back();
  } else hideSheet();
}
window.addEventListener("popstate", e => {
  if (sheet.classList.contains("open")){ ignoreHash = true; hideSheet(); setTimeout(() => { ignoreHash = false; }, 100); return; }
  // Back (or any history move) shows whatever the restored address points to; Study's entry holds a Study card.
  ignoreHash = true;
  if (!fromHash()) switchTab("study");
  setTimeout(() => { ignoreHash = false; }, 100);
});
document.getElementById("openDays").addEventListener("click", openSheet);
document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", openSheet));
document.getElementById("closeDays").addEventListener("click", () => closeSheet());
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
document.getElementById("nextBtn").addEventListener("click", next);
[["study", S], ["py", P]].forEach(([tab, T]) => {
  T.el.querySelector(".toTop").addEventListener("click", () => go(tab, 0));
  twoTap(T.el.querySelector(".reset"), "Tap again to clear", () => {
    Object.keys(T.answers).forEach(k => delete T.answers[k]);
    store.set(T.cfg.answersKey, {});
    Object.values(T.resetters).forEach(list => list.forEach(f => f()));
    updateScore(tab, false);
  });
});

/* ---------- Resume buttons ---------- */
function wireResume(tab, btnId, posKey, word){
  const T = TABS[tab], btn = document.getElementById(btnId);
  const idx = T.cards.findIndex(c => c.el.id === store.get(posKey, ""));
  if (idx > 0 && T.cards[idx].group >= 0) btn.textContent = `Continue ${word} ${T.cards[idx].group + 1}`;
  btn.addEventListener("click", () => {
    const i = T.cards.findIndex(c => c.el.id === store.get(posKey, ""));
    if (i > 0 && T.cards[i].group >= 0) go(tab, i); else goGroup(tab, 0);
  });
}
wireResume("study", "resume", "cr2-pos", "Day");
wireResume("py", "pyResume", "cr2-py-pos", "Lesson");

document.addEventListener("keydown", e => {
  if (sheet.classList.contains("open")){ if (e.key === "Escape") closeSheet(); return; }
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (["ArrowDown","PageDown","j"," "].includes(e.key)){ e.preventDefault(); next(); }
  if (["ArrowUp","PageUp","k"].includes(e.key)){ e.preventDefault(); prev(); }
});

/* ---------- Hash links ----------
   #day-5 or #d5-7 open Study, #py-3 or #p3-2 open Python, #feed opens the Feed,
   #study and #python open a tab at its current card. */
function fromHash(hash){
  const id = (hash || location.hash).slice(1);
  if (id === "feed" || id === "study" || id === "python"){ switchTab(id === "python" ? "py" : id); return true; }
  for (const tab of ["study","py"]){
    const idx = TABS[tab].cards.findIndex(c => c.el.id === id);
    if (idx >= 0 && /^(day-\d+|d\d+-\d+|py-\d+|p\d+-\d+|start|finish|py-start|py-finish)$/.test(id)){ switchTab(tab); go(tab, idx); return true; }
  }
  return false;
}
window.addEventListener("hashchange", () => { if (ignoreHash){ ignoreHash = false; return; } fromHash(); });

// A link to a card or tab wins; otherwise reopen the last tab used.
const savedTab = store.get("cr2-tab", "study");
switchTab(TABS[savedTab] ? savedTab : "study");
if (initialHash) requestAnimationFrame(() => setTimeout(() => fromHash(initialHash), 50));
else if (active === "feed") requestAnimationFrame(() => go("feed", 1));
</script>
