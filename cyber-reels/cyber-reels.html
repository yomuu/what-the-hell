  {d:3, q:"You find a root-owned SUID program that can run shell commands. Why is that dangerous?", o:["Any user could run commands as root through it","It slows down the boot process","It isn't, SUID only affects the file's owner"], k:0,
   w:"SUID runs the program with its owner's rights. If it can launch commands, those commands run as root too."}
 ],
 recap:["rwx for owner, group and others. r=4, w=2, x=1.","chmod, chown and sudo are the core tools.","Windows uses ACLs and UAC.","Use standard accounts, and watch for risky SUID programs."]},

{t:"Processes and services",
 sub:"What's running, and should it be?",
 learn:[
  ["Processes","A process is a running program with a process ID (PID). Each one runs as a user and has a parent process that started it. Parent and child links are a key clue in investigations."],
  ["Services and daemons","A service runs in the background without anyone logged in. On Linux it's called a daemon, and systemd manages most of them. Many listen on a port, like sshd or a web server."],
  ["Linux tools","`ps aux` lists processes, `top` shows them live, and `systemctl status ssh` checks the SSH service (it's called sshd on Red Hat systems). `sudo ss -tulpn` ties listening ports to processes."],
  ["Windows tools","Task Manager and `Get-Process` show processes. `Get-Service` and services.msc show services. Process Explorer, from Microsoft's free Sysinternals suite, shows parent and child processes and file paths."],
  ["Spotting the odd one out","Warning signs: a familiar name in the wrong folder, an odd parent (Word starting PowerShell), a service nobody installed, or an unknown program listening on a port. You need to know normal first."]
 ],
 real:["SolarWinds, 2020","Attackers slipped malicious code into updates of SolarWinds Orion, a trusted IT monitoring tool, and up to 18,000 customers installed them. The backdoor ran inside Orion's own legitimate process, so it looked normal. It was discovered in December 2020, months after the first tainted update shipped."],
 myth:["A process with a familiar name like svchost.exe is legitimate.","Malware often borrows trusted names. Check the file path, the signer, the parent process and the user it runs as. The real svchost.exe lives in C:\\Windows\\System32 (or SysWOW64 for 32-bit copies)."],
 tryit:{h:"Map what's running", where:"Kali, then Windows target",
  p:"List the busiest processes and running services. On Windows, run PowerShell as administrator to see each process's parent and path, and look for anything outside the usual folders.",
  code:`# Kali
ps aux --sort=-%cpu | head
systemctl list-units --type=service --state=running

# Windows PowerShell
Get-CimInstance Win32_Process |
  Select-Object ProcessId, ParentProcessId, Name, ExecutablePath`},
 quiz:[
  {d:1, q:"Which command checks whether the SSH service is running on Kali?", o:["systemctl status ssh","chmod ssh","ping ssh"], k:0,
   w:"systemctl manages and reports on services. On Debian, Ubuntu and Kali the unit is ssh; on Red Hat systems it's sshd."},
  {d:2, q:"Microsoft Word starts PowerShell, which then downloads a file. Why is that suspicious?", o:["Office apps rarely need to start PowerShell; it's a common malicious macro pattern","PowerShell is malware","Word can never start other processes"], k:0,
   w:"PowerShell is a legitimate tool, but Word as its parent is a classic sign of a malicious document."},
  {d:2, q:"A process named svchost.exe is running from C:\\Users\\Public. What do you conclude?", o:["It's suspicious, because the real one runs from System32","It's normal Windows behaviour","It's a Linux daemon"], k:0,
   w:"The name is borrowed. The path gives it away. Record the details and escalate."},
  {d:1, q:"On Linux, what is a daemon?", o:["A background service","A type of virus","The root password"], k:0,
   w:"Daemons are background services, often ending in d, like sshd or crond."}
 ],
 recap:["Process: a running program with a PID, a user and a parent.","Service or daemon: runs in the background, often on a port.","Check path, parent, signer and user, not just the name.","Know your normal so the odd one stands out."]},

{t:"The command line",
 sub:"Faster, scriptable and where the tools live.",
 learn:[
  ["Why the command line","A GUI is fine for one machine. The command line is faster, works over SSH and can be scripted across hundreds of machines. Most security tools are command-line first."],
  ["Linux essentials","`ls -la` lists files, including hidden ones. `cd` moves around, `cat` prints a file, `less` pages through it and `grep` finds matching lines. `ip a` shows addresses and `ss -tulpn` shows listening ports."],
  ["Windows essentials","`ipconfig /all` shows network settings. `ping` and `tracert` test reachability, `nslookup` queries DNS and `netstat -ano` lists connections with process IDs."],
  ["Pipes","A pipe sends one command's output into the next. `journalctl -u ssh | grep \"Failed password\" | wc -l` counts failed SSH logins. Chaining small tools is how most quick investigations work."],
  ["PowerShell objects","PowerShell passes objects, not plain text, between commands, so you can filter by property: `Get-Service | Where-Object Status -eq Running`. That makes it powerful for admins, and for attackers too."],
  ["Getting help","Nobody memorises every flag. Use `man grep` or `grep --help` on Linux, and `Get-Help Get-Process -Examples` in PowerShell. Reading help quickly is a real skill."]
 ],
 real:["Help desk: “the internet's down”","A user can't reach anything. If `ipconfig` shows 169.254.x.x, DHCP failed: check the cable, Wi-Fi and DHCP server. If the address looks normal, ping the gateway, then a public IP, then try nslookup. In two minutes you know if it's the link, DHCP, routing or DNS."],
 myth:["You have to memorise every command and flag.","Professionals look things up all the time. Know the core tools well, and know how to use man, --help and Get-Help for the rest."],
 tryit:{h:"Count failed logins", where:"Kali terminal",
  p:"Kali logs to the systemd journal, so read SSH logs with journalctl. Start SSH, fail a login on purpose, count the failures and see which IP they came from. Stop SSH afterwards.",
  code:`sudo systemctl start ssh
ssh nobody@127.0.0.1    # type yes, any password, then Ctrl+C
sudo journalctl -u ssh | grep -c "Failed password"
sudo journalctl -u ssh | grep "Failed password" |
  awk '{print $(NF-3)}' | sort | uniq -c
sudo systemctl stop ssh`},
 quiz:[
  {d:1, q:"Which Linux command lists listening ports and the processes using them?", o:["ss -tulpn","ls -la","cd /ports"], k:0,
   w:"ss shows sockets: -t TCP, -u UDP, -l listening, -p process, -n numeric. Use sudo to see processes owned by other users."},
  {d:2, q:"`ipconfig` shows the address 169.254.10.7. What's the most likely problem?", o:["The PC couldn't get an address from DHCP","DNS is down","The website is blocked"], k:0,
   w:"169.254.x.x is a self-assigned (APIPA) address. Windows uses it when no DHCP server answers."},
  {d:2, q:"In `ps aux | grep sshd`, what does the `|` do?", o:["Sends the output of ps into grep","Runs both commands separately","Saves the output to a file called grep"], k:0,
   w:"The pipe feeds one command's output to the next command's input. `>` is the one that writes to a file."},
  {d:1, q:"Which Windows command lists connections with their process IDs?", o:["netstat -ano","ipconfig /all","tracert"], k:0,
   w:"-a shows all connections, -n keeps addresses numeric and -o adds the PID."}
 ],
 recap:["Linux: ls, cd, cat, grep, ip a, ss -tulpn, journalctl.","Windows: ipconfig, ping, tracert, nslookup, netstat -ano.","Pipes chain small tools into an investigation.","Use man, --help and Get-Help instead of memorising."]},

{t:"Encryption vs hashing",
 sub:"Two-way locks and one-way fingerprints.",
 learn:[
  ["Encryption","Encryption scrambles data so only someone with the right key can read it, at rest or in transit. Don't confuse it with encoding, like Base64, which anyone can reverse with no key."],
  ["Symmetric","Symmetric encryption uses one shared key to encrypt and decrypt. AES is the standard, and it's fast enough for disks and VPN traffic. The hard part is sharing the key safely."],
  ["Asymmetric","Asymmetric cryptography uses a key pair. What the public key encrypts, only the private key can decrypt. RSA and elliptic-curve cryptography are common. It's slow, so it's mainly used to agree keys and to sign things."],
  ["Hashing","A hash function turns any input into a fixed-length digest, like SHA-256's 256 bits. It's one-way: you can't reverse it, though short or common inputs can be guessed and checked. Change one character and the digest changes completely."],
  ["Digital signatures","To sign, you hash a message and sign the hash with your private key. Anyone with your public key can check it. That proves integrity and who signed. TLS certificates and software updates rely on this."],
  ["Storing passwords","Hash passwords with a slow, salted algorithm like bcrypt or Argon2. The salt makes identical passwords produce different hashes. The slowness makes cracking expensive. Fast hashes like MD5 are the wrong tool."]
 ],
 real:["Adobe, 2013","In 2013 attackers stole data on around 150 million Adobe accounts. The passwords were encrypted with 3DES instead of hashed, all with the same key and mode, so identical passwords looked identical. Plain-text password hints sat right next to them, which made many easy to guess."],
 myth:["Encrypting passwords is the safest way to store them.","If the key leaks, every password is exposed at once. Hash them with a slow, salted algorithm so even the server can't reverse them."],
 tryit:{h:"See a hash change", where:"Any machine with Python 3",
  p:"Hash two words that differ by one letter and compare the digests. Then hash a file you've downloaded and compare it with the value the publisher lists.",
  code:`import hashlib
for word in ["hello", "hellp"]:
    print(word, hashlib.sha256(word.encode()).hexdigest())

# File hash, Linux:   sha256sum kali.iso
# File hash, Windows: Get-FileHash .\\kali.iso`},
 quiz:[
  {d:1, q:"You compare a downloaded ISO's SHA-256 value with the publisher's. What are you checking?", o:["Confidentiality","Integrity","Availability"], k:1,
   w:"A matching hash shows the file wasn't altered or corrupted. It doesn't hide the contents."},
  {d:2, q:"A message is encrypted with Alice's public key. Which key decrypts it?", o:["Alice's private key","Alice's public key","The sender's private key"], k:0,
   w:"Only the matching private key can decrypt. That's why the public key can be shared freely."},
  {d:1, q:"Which of these is a symmetric encryption algorithm?", o:["AES","RSA","SHA-256"], k:0,
   w:"AES uses one shared key. RSA is asymmetric and SHA-256 is a hash, not encryption."},
  {d:3, q:"Two users have the same password, but their stored hashes are different. Why?", o:["Each password got a unique salt before hashing","Hashing is random every time","The passwords were encrypted with different keys"], k:0,
   w:"The same input always gives the same hash. A unique salt per user changes the input, so the hashes differ and precomputed tables don't work."}
 ],
 recap:["Encryption is reversible with a key: confidentiality.","Symmetric (AES) is fast; asymmetric (RSA, ECC) agrees keys and signs.","Hashing is one-way: integrity.","Passwords: bcrypt or Argon2 with a salt, never plain encryption."]},

{t:"Virtualisation and lab safety",
 sub:"Break things safely, and keep the mess in the lab.",
 learn:[
  ["Hypervisors","A hypervisor runs virtual machines, each with its own OS. Type 1 runs on bare metal: Proxmox, ESXi, Hyper-V. Type 2 runs on top of an OS: VirtualBox, VMware Workstation."],
  ["Why labs use VMs","VMs let you build, break and rebuild systems for free. Snapshots save a known-good state, so you can roll back after an exercise in seconds. The cloud is built on the same idea."],
  ["VirtualBox network modes","NAT: the VM reaches the internet through the host (NAT Network also lets VMs see each other). Bridged: the VM joins your real home network. Internal: VMs talk only to each other. Host-only: VMs talk to each other and to the host."],
  ["Isolation isn't guaranteed","VMs reduce risk but don't guarantee isolation. Shared folders, a shared clipboard, drag and drop, bridged networking and hypervisor bugs can all leak. Turn off what you don't need."],
  ["Lab rules","Keep vulnerable VMs on an internal or host-only network, never bridged. Snapshot before each exercise. Keep the hypervisor patched. Keep real passwords and personal files out of lab VMs."]
 ],
 real:["VENOM, 2015","In 2015 researchers disclosed VENOM, a bug in the virtual floppy controller used by QEMU, Xen, KVM and VirtualBox. Code in a guest VM could potentially break out to the host. Few people had thought about the floppy drive. Every device a hypervisor emulates is attack surface."],
 myth:["A VM is a perfect sandbox.","Escapes are rare but real, and misconfiguration is far more common. A shared folder or bridged adapter can expose your host and home network. Treat the VM boundary as a strong layer, not a guarantee."],
 tryit:{h:"Lock down a lab VM", where:"Host terminal, VM powered off",
  p:"Put each VM on the internal network labnet, turn off clipboard and drag and drop, then snapshot it (VirtualBox 7 syntax). Remove shared folders under Settings, Shared Folders.",
  code:`VBoxManage modifyvm "Win-Target" --nic1 intnet --intnet1 "labnet"
VBoxManage modifyvm "Win-Target" --clipboard-mode disabled --drag-and-drop disabled
VBoxManage snapshot "Win-Target" take "clean-baseline"
# Repeat for your Kali VM, so both share labnet`},
 quiz:[
  {d:1, q:"Which network mode should a deliberately vulnerable VM use?", o:["Bridged","Internal or host-only","Whatever the default is"], k:1,
   w:"Bridged puts the VM on your real home network. Internal or host-only keeps it inside the lab."},
  {d:1, q:"Which of these is a Type 2 hypervisor?", o:["VirtualBox","ESXi","Proxmox"], k:0,
   w:"VirtualBox runs as an app on top of your OS. ESXi and Proxmox run directly on the hardware."},
  {d:2, q:"Why take a snapshot before a lab exercise?", o:["So you can roll back to a known-good state","It encrypts the VM","It isolates the VM's network"], k:0,
   w:"If the exercise breaks or infects the VM, you restore the snapshot in seconds."},
  {d:3, q:"Your lab VMs are on an internal network, but a shared folder maps your host's Documents folder. What's the risk?", o:["Anything running in the VM could read or change your real files","None, because internal mode isolates everything","The VM will lose its IP address"], k:0,
   w:"The network is only one path out. Shared folders, clipboard and drag and drop are others. Turn them off on attack and target VMs."}
 ],
 recap:["Type 1 runs on hardware; Type 2 runs on an OS.","NAT, bridged, internal and host-only all behave differently.","VMs reduce risk but don't guarantee isolation.","Vulnerable VMs go on internal or host-only networks, never bridged."]},

{t:"Week 3 review",
 sub:"Operating systems and crypto, pulled together.",
 learn:[
  ["How to review","Answer each review heading from memory before reading the card. Then do the hands-on task. Doing it sticks far better than rereading."]
 ],
 real:["LastPass, 2022","In 2022 attackers stole backups of LastPass customer vaults. Each vault was encrypted with a key derived from the user's master password, so safety came down to password strength and hashing rounds. Some old accounts had very low settings, and saved website addresses weren't encrypted."],
 myth:["Linux and Windows security are completely different skills.","The concepts carry over: least privilege, services, logs, patching and hardening. Only the commands and file locations change."],
 tryit:{h:"Prove a permission works", where:"Kali terminal",
  p:"Create a test user, make a file in /tmp only you can read, and confirm the test user gets “Permission denied”. Then clean up. A mail spool warning from userdel is harmless.",
  code:`sudo useradd -m tester
echo "top secret" > /tmp/private.txt
chmod 600 /tmp/private.txt
sudo -u tester cat /tmp/private.txt
rm /tmp/private.txt
sudo userdel -r tester`},
 review:[
  ["Linux vs Windows","Linux: text config under /etc, logs under /var/log or the journal, packages via apt or dnf. Windows: the Registry, Event Viewer, Active Directory and Group Policy."],
  ["Permissions","rwxr-x--- is 750: owner everything, group read and execute, others nothing. chmod changes it, chown changes the owner, sudo elevates one command. Watch for root-owned SUID programs."],
  ["Processes and services","A process is a running program with a PID, a user and a parent. A service runs in the background, often on a port. Suspicious: wrong path, odd parent, unknown listener."],
  ["Command line","Linux: ls -la, grep, ss -tulpn, journalctl, systemctl. Windows: ipconfig /all, netstat -ano, Get-Process, Get-Service. Pipes chain them together."],
  ["Crypto in one card","Symmetric (AES): one key, fast. Asymmetric (RSA, ECC): key pair, for key agreement and signatures. Hashing (SHA-256): one-way, for integrity. Passwords: bcrypt or Argon2 with a salt."],
  ["Lab safety","Internal or host-only networks for vulnerable VMs, never bridged. Snapshot before exercises. Turn off shared folders and clipboard. Keep the hypervisor patched."]
 ],
 quiz:[
  {d:2, q:"What's the right way to store user passwords?", o:["Encrypted with AES","Hashed with a slow, salted algorithm like bcrypt or Argon2","Hashed with plain MD5"], k:1,
   w:"Passwords should be hashed, not encrypted, with a slow salted algorithm so cracking is expensive. MD5 is far too fast."},
  {d:2, q:"What's the octal value of rw-r--r--?", o:["644","755","600"], k:0,
   w:"rw- is 6, r-- is 4, r-- is 4. It's a common setting for files everyone may read but only the owner may change."},
  {d:3, q:"HTTPS uses asymmetric cryptography in the handshake, then symmetric encryption for the data. Why?", o:["Asymmetric is slow, so it's used to authenticate and agree a key; fast symmetric encryption carries the data","Symmetric encryption is less secure","Asymmetric cryptography can't protect data at all"], k:0,
   w:"Each does what it's best at. The handshake agrees a shared key, and AES or ChaCha20 then encrypts the traffic quickly."},
  {d:1, q:"Where are most traditional Linux log files kept?", o:["/var/log","/etc","/home"], k:0,
   w:"/var/log holds text logs. Many newer systems also use the systemd journal, read with journalctl."},
  {d:3, q:"An unknown service on a Windows server listens on port 4444 and runs from C:\\ProgramData\\upd.exe. What's your best first step?", o:["Record the details and escalate it as a possible compromise","Delete the file straight away","Ignore it, because services are trusted"], k:0,
   w:"Deleting it destroys evidence and may not remove the attacker. Note the path, hash, parent and connections, then follow your incident process."},
  {d:2, q:"Where would you look for a program that starts every time a user logs on to Windows?", o:["The Run keys in the Registry","/etc/shadow","The Windows firewall log"], k:0,
   w:"Run keys under HKLM and HKCU are classic persistence spots, along with scheduled tasks and services."},
  {d:2, q:"Which VirtualBox mode lets VMs talk to each other and the host, but not the internet?", o:["Host-only","NAT","Bridged"], k:0,
   w:"Host-only is a private network shared with the host. Internal is the same without the host."},
  {d:3, q:"What proves a software update really came from its publisher?", o:["A valid digital signature","A matching file size","Downloading it over HTTPS"], k:0,
   w:"A signature ties the file to the publisher's private key. HTTPS only protects the download from whichever server you used."}
 ],
 recap:["Know where config, logs and services live on both systems.","Read permissions in rwx and octal.","Symmetric, asymmetric and hashing each have one job.","Lab VMs stay off bridged networks."]},
/* ---------------- WEEK 4: Hands-on analysis ---------------- */
{t:"Scanning with Nmap",
 sub:"See your network the way an attacker would.",
 learn:[
  ["What Nmap does","Nmap discovers live hosts, open ports, running services and their versions. Defenders use it to check their own exposure; attackers use it for reconnaissance. Same tool, different permission."],
  ["Permission first","Only scan systems you own or have written permission to test. Unauthorised scanning can breach laws and acceptable use policies, and it sets off alarms. Your internal lab is the place to practise."],
  ["Host discovery","`sudo nmap -sn 10.10.10.0/24` finds live hosts without scanning ports. Run as root on a local subnet, Nmap uses ARP, so even hosts that block ping show up. Without sudo it falls back to weaker probes."],
  ["The SYN scan","`sudo nmap -sS` sends a SYN to each port. SYN-ACK means open, RST means closed, and no reply means filtered. Nmap never completes the handshake, which is why it's called a half-open scan."],
  ["Versions and scripts","`-sV` identifies the service and version on open ports, `-O` guesses the OS and `-sC` runs default scripts for extra detail. By default Nmap scans the 1,000 most common TCP ports; `-p-` scans all 65,535. UDP services like DNS need `-sU`."],
  ["From results to risk","A port list is just an inventory. Compare each service and version with what should be there, then look up known vulnerabilities for those versions. Open isn't the same as vulnerable."]
 ],
 real:["The internet is always scanning","Services like Shodan and Censys scan the whole IPv4 internet continuously and index what they find. Anything you expose, like RDP or an old admin page, can be listed within days. Attackers often search these indexes instead of scanning themselves."],
 myth:["A SYN scan is stealthy, so nobody notices it.","Skipping the final ACK avoids some application logs, but firewalls and intrusion detection systems spot a burst of SYNs easily. You'll see that for yourself in the Day 25 lab."],
 tryit:{h:"Scan your target", where:"Kali, against the Windows target only",
  p:"Find live hosts, scan the top ports, then identify versions. With the Windows firewall on, expect mostly filtered ports.",
  code:`sudo nmap -sn 10.10.10.0/24
sudo nmap -sS --top-ports 100 10.10.10.20
sudo nmap -sS -sV -p 135,139,445,3389 10.10.10.20`},
 quiz:[
  {d:2, q:"Why is `-sS` called a half-open scan?", o:["It scans half the ports","It never completes the TCP handshake","It only works on half of hosts"], k:1,
   w:"After the SYN-ACK, Nmap doesn't send the final ACK, so a full connection is never made."},
  {d:1, q:"What does `nmap -sn` do?", o:["Finds live hosts without scanning ports","Scans all 65,535 ports","Detects service versions"], k:0,
   w:"-sn is host discovery only. It's a quick, quiet first step."},
  {d:2, q:"Which flag tells Nmap to identify service versions?", o:["-sV","-sS","-sn"], k:0,
   w:"-sV probes open ports to work out the service and version, which you need before looking up vulnerabilities."},
  {d:1, q:"When is it OK to scan a network?", o:["When you own it or have written permission","Whenever it's only a SYN scan","Whenever it's on the internet"], k:0,
   w:"Permission is what separates a security test from an attack. Get it in writing."}
 ],
 recap:["Only scan what you own or have written permission to test.","-sn finds hosts, -sS finds ports, -sV finds versions.","Open, closed and filtered come from SYN-ACK, RST or silence.","A scan result is an inventory, not a list of vulnerabilities."]},

{t:"Packets with Wireshark",
 sub:"What's really on the wire.",
 learn:[
  ["What Wireshark does","Wireshark captures packets from a network interface and decodes every layer, from Ethernet up to HTTP. It shows what's really on the wire, not what an app claims is happening."],
  ["Capture vs display filters","Capture filters, like `host 10.10.10.20`, decide what gets recorded and use BPF syntax. Display filters, like `ip.addr == 10.10.10.20`, decide what you see afterwards. You can change display filters any time."],
  ["Display filters to know","`dns`, `http`, `tls`, `arp`, `icmp` and `tcp.port == 443`. `tcp.flags.syn == 1 && tcp.flags.ack == 0` shows new connection attempts. Combine filters with `&&`, `||` and `!`."],
  ["Follow the stream","Right-click a packet and choose Follow, then TCP Stream, to rebuild a whole conversation. With cleartext protocols you can read requests, responses and even passwords. With TLS you see only encrypted data."],
  ["What TLS still reveals","Even encrypted traffic shows IP addresses, ports, timing and how much data moved. The TLS handshake usually shows the server name too. That metadata is often enough to spot something odd."],
  ["Capture responsibly","Only capture on networks you own or are authorised to monitor. Packets can hold passwords and personal information, so store capture files carefully and delete them when you're done."]
 ],
 real:["Firesheep, 2010","In 2010 a Firefox add-on called Firesheep let anyone on public Wi-Fi grab other people's session cookies for sites like Facebook and Twitter with one click. Those sites used HTTPS for the login page but not for the rest of the session. The outcry pushed big sites to use HTTPS everywhere."],
 myth:["With Wireshark you can read anyone's HTTPS traffic.","TLS encrypts the content. You see addresses, ports, timing and usually the server name, but not the pages or passwords unless you hold the session keys."],
 tryit:{h:"Catch a cleartext request", where:"Kali and Windows target",
  p:"On Kali, start Wireshark with sudo and capture on eth0. Serve a folder over plain HTTP on 8080, a port Wireshark decodes as HTTP. Browse to it from Windows, then follow the TCP stream and read the request.",
  code:`# Kali: serve the current folder over plain HTTP
python3 -m http.server 8080

# Windows browser
http://10.10.10.10:8080

# Wireshark display filter on Kali
http && ip.addr == 10.10.10.20`},
 quiz:[
  {d:2, q:"Which of these is a Wireshark display filter, not a capture filter?", o:["host 10.10.10.20","ip.addr == 10.10.10.20","port 80"], k:1,
   w:"ip.addr == is display filter syntax. host and port are capture (BPF) syntax."},
  {d:2, q:"Which display filter shows new TCP connection attempts?", o:["tcp.flags.syn == 1 && tcp.flags.ack == 0","tcp.flags.fin == 1","udp"], k:0,
   w:"The first packet of a handshake has SYN set and ACK clear. A scan lights this filter up."},
  {d:2, q:"You capture HTTPS traffic to a website. What can you usually still see?", o:["IP addresses, ports, timing and the server name","The password that was typed","The full page contents"], k:0,
   w:"The content is encrypted, but the metadata isn't. That's often enough for an investigation."},
  {d:1, q:"What does Follow TCP Stream do?", o:["Rebuilds a whole conversation in order","Blocks the connection","Decrypts TLS traffic"], k:0,
   w:"It stitches the packets of one connection back together so you can read the exchange."}
 ],
 recap:["Capture filters decide what's recorded; display filters decide what you see.","Know dns, http, tls, arp and the SYN-without-ACK filter.","Follow TCP Stream rebuilds a conversation.","TLS hides content but not metadata."]},

{t:"Reading logs",
 sub:"The record of what really happened.",
 learn:[
  ["Why logs matter","Logs record logins, errors, changes and connections. Without them you can't detect an attack or prove what an attacker did. OWASP Top 10:2025 lists Security Logging and Alerting Failures as A09."],
  ["Linux logs","Systems running rsyslog, such as Ubuntu, write authentication events to /var/log/auth.log; the Red Hat family uses /var/log/secure. Newer Debian and Kali log only to the systemd journal: `journalctl -u ssh` shows SSH events."],
  ["Windows Security log","Event Viewer's Security log records logons and account changes. Key IDs: 4624 successful logon, 4625 failed logon, 4672 special (admin-level) privileges at logon, 4720 user account created, 1102 audit log cleared."],
  ["Logon types","Events 4624 and 4625 include a logon type. Type 2 is at the keyboard, 3 is over the network (like a file share) and 10 is Remote Desktop. With Network Level Authentication on, failed RDP logons often show as type 3, so check the source IP too."],
  ["SIEMs","A SIEM collects logs from many systems in one place, correlates them and raises alerts. Wazuh is a free, open-source option; Microsoft Sentinel and Splunk are common at work. Alerts only help if someone acts on them."],
  ["Red flags","Many failures then a success from the same IP. A logon at 3am from a new country. A new admin account. The Security log being cleared. Any one might be innocent; together they tell a story."]
 ],
 real:["Target's ignored alerts, 2013","Remember Target from Day 9? Its malware detection tool raised alerts as the attackers set up, and a monitoring team overseas passed them on. The team in the US didn't act on them in time. Logging and alerting only help when someone responds."],
 myth:["No alerts means no attacks.","It might mean you aren't collecting the right logs, or nobody has tuned the alerts. Attackers also clear logs, which is why Event ID 1102 matters."],
 tryit:{h:"Find your own failed logons", where:"Windows target",
  p:"Lock the Windows target and enter a wrong password three times. Then log in and pull the failures. If nothing shows, check that logon auditing is turned on.",
  code:`# Windows PowerShell (admin)
Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4625} -MaxEvents 5 |
  Format-List TimeCreated, Message

auditpol /get /subcategory:"Logon"`},
 quiz:[
  {d:1, q:"Hundreds of Event ID 4625 entries from one IP in a minute suggest what?", o:["A software update","A brute-force or password-spraying attempt","A normal backup job"], k:1,
   w:"4625 is a failed logon. A burst from one source is a classic brute-force signal."},
  {d:2, q:"Event ID 1102 appears on a server at 2am. Why worry?", o:["Someone cleared the Security log, possibly to hide their tracks","It's a routine backup","A user changed their wallpaper"], k:0,
   w:"Clearing the log is rare in normal operations and common after an intrusion. Investigate who did it."},
  {d:3, q:"Many 4625 events with logon type 10 arrive from one external IP. What's being targeted?", o:["Remote Desktop","A file share","The local keyboard"], k:0,
   w:"Type 10 is RemoteInteractive, which is RDP. Type 3 is usually a network logon like a file share, though with NLA on, failed RDP attempts can show as type 3 too."},
  {d:3, q:"What does OWASP Top 10:2025 call A09?", o:["Security Logging and Alerting Failures","Security Logging and Monitoring Failures","Insufficient Logging"], k:0,
   w:"The 2021 name was Security Logging and Monitoring Failures. The 2025 list renamed it to stress alerting."}
 ],
 recap:["Linux: auth.log, secure or journalctl.","Windows: 4624, 4625, 4672, 4720 and 1102.","Logon type 3 is network, 10 is RDP, but failed RDP often shows as 3.","A SIEM centralises logs, but someone has to act on alerts."]},

{t:"Lab: scan and watch",
 sub:"Attack your own lab and see what the defender sees.",
 learn:[
  ["The plan","You'll scan the Windows target from Kali while watching with Wireshark and the Windows firewall log. Seeing both sides of one attack is the fastest way to learn detection."],
  ["Set up","Both VMs on the labnet internal network: Kali at 10.10.10.10, Windows at 10.10.10.20. Snapshot both first. Confirm they can see each other with `sudo nmap -sn 10.10.10.0/24`."],
  ["Give the defender eyes","Windows Defender Firewall doesn't log dropped packets by default. Turn logging on (see the Try it card). The log lives at C:\\Windows\\System32\\LogFiles\\Firewall\\pfirewall.log."],
  ["Run the scan","Start Wireshark on Kali's eth0, then apply the display filter `tcp.flags.syn == 1 && tcp.flags.ack == 0`. Now run the SYN scan. Watch a wall of SYNs from one source hit many ports in seconds."],
  ["Compare the evidence","In Wireshark, Statistics then Conversations shows one source talking to many ports. On Windows, the firewall log shows a DROP line for each blocked probe. What did the scan learn, and what did the defender see?"]
 ],
 real:["A scan from the inside","SOC analysts treat scans very differently depending on where they come from. Scans from the internet are constant background noise. An internal laptop scanning the server subnet often means a compromised machine looking for its next hop."],
 myth:["If a scan didn't show up in Event Viewer, nothing recorded it.","A SYN scan rarely creates logon events, but firewall logs, network flow records and intrusion detection systems all see it. Detection depends on looking in the right place."],
 tryit:{h:"Run the lab", where:"Windows target, then Kali",
  p:"Turn on firewall logging and tail the log on Windows. Then scan from Kali and watch the DROP lines arrive. Afterwards, restore both clean snapshots.",
  code:`# Windows PowerShell (admin)
Set-NetFirewallProfile -All -LogBlocked True
Get-Content C:\\Windows\\System32\\LogFiles\\Firewall\\pfirewall.log -Tail 20 -Wait

# Kali
sudo nmap -sS --top-ports 200 10.10.10.20

# Windows: turn logging off again
Set-NetFirewallProfile -All -LogBlocked False`},
 quiz:[
  {d:1, q:"What pattern in Wireshark shows a port scan?", o:["Many SYNs from one source to many ports","One long TLS session","Only DNS replies"], k:0,
   w:"A scanner probes many ports fast, so you see a burst of SYNs from one IP across many destination ports."},
  {d:2, q:"Once logging is on, where does Windows Defender Firewall record dropped packets?", o:["pfirewall.log","The Security log as Event ID 4625","/var/log/auth.log"], k:0,
   w:"The firewall writes its own text log. 4625 is a failed logon, and auth.log is on Linux."},
  {d:2, q:"Most ports on the Windows target show as filtered. What does that tell you?", o:["The firewall is silently dropping the probes","Those ports are open","The Windows VM is switched off"], k:0,
   w:"Filtered means no useful reply came back. A powered-off host would show as down, not filtered."},
  {d:3, q:"A finance laptop starts scanning the server subnet at midnight. What's the most likely explanation?", o:["The laptop may be compromised and looking for its next target","Normal Windows updates","An overnight backup job"], k:0,
   w:"Workstations don't scan servers in normal operations. Treat it as possible lateral movement and investigate."}
 ],
 recap:["Snapshot first, internal network only.","Wireshark shows a burst of SYNs from one source.","Turn on firewall logging to see the drops.","Internal scanning is a lateral movement red flag."]},

{t:"Defence in depth and incident response",
 sub:"Layers before, a plan during, lessons after.",
 learn:[
  ["Defence in depth","Stack controls so one failure doesn't become a breach: training, MFA, patching, firewalls, segmentation, endpoint protection, logging and backups. Each layer is another chance to stop or spot an attacker."],
  ["Types of control","Preventive controls stop things, like MFA and firewalls. Detective controls spot them, like logs and alerts. Corrective controls fix things afterwards, like backups and reimaging. Good defence mixes all three."],
  ["The four-phase cycle","NIST SP 800-61 Rev. 2 described four phases: preparation; detection and analysis; containment, eradication and recovery; and post-incident activity. You'll still see it in textbooks and interviews."],
  ["Rev. 3 and CSF 2.0","NIST SP 800-61 Rev. 3 (April 2025) instead organises incident response around the six CSF 2.0 functions: Govern, Identify, Protect, Detect, Respond, Recover. Preparation is now spread across Govern, Identify and Protect."],
  ["In the moment","Contain first: isolate the machine from the network, but don't switch it off, because memory holds evidence. Preserve logs, note what you do and when, and escalate. Then remove the cause and recover from clean backups."],
  ["Learn from it","After recovery, hold a blameless review and fix the gaps. If personal information was breached and serious harm is likely, report it: to the OAIC in Australia or the Privacy Commissioner in NZ."]
 ],
 real:["Maersk and NotPetya, 2017","In June 2017 NotPetya malware tore through shipping giant Maersk, wiping thousands of machines within hours. Every domain controller was hit except one in Ghana, which happened to be offline during a power cut. That one copy let Maersk rebuild its network in about ten days."],
 myth:["Incident response starts when you get breached.","Most of it happens before: knowing your assets, backups, logging, contacts and a written plan. Rev. 3 makes that explicit with Govern, Identify and Protect."],
 tryit:{h:"Write a mini playbook", where:"Notes app or your GitHub repo",
  p:"Write a one-page playbook for “a user entered their password on a phishing page”. Cover who to tell, resetting the password and signing out all sessions, which logs to check, and what to tell the user."},
 quiz:[
  {d:2, q:"What does NIST SP 800-61 Rev. 3 align incident response with?", o:["The OWASP Top 10","The NIST CSF 2.0 functions","The OSI model"], k:1,
   w:"Rev. 3 is a CSF 2.0 Community Profile, so incident response sits under the CSF functions."},
  {d:2, q:"A laptop shows signs of ransomware. What should you do first?", o:["Disconnect it from the network but leave it powered on","Switch it off at the wall","Run a disk clean-up"], k:0,
   w:"Isolating stops the spread. Keeping it on preserves memory evidence such as running processes and keys."},
  {d:1, q:"Which of these is a detective control?", o:["Alerting on repeated failed logons","MFA","Restoring from backup"], k:0,
   w:"Alerts detect. MFA prevents, and restoring from backup corrects."},
  {d:3, q:"What are the six CSF 2.0 functions?", o:["Govern, Identify, Protect, Detect, Respond, Recover","Identify, Protect, Detect, Respond, Recover","Prepare, Detect, Contain, Eradicate, Recover, Review"], k:0,
   w:"CSF 2.0 added Govern to the five functions of CSF 1.1."}
 ],
 recap:["Defence in depth: many layers, no single point of failure.","Preventive, detective and corrective controls.","Rev. 2 had four phases; Rev. 3 uses the CSF 2.0 functions.","Isolate, preserve evidence, escalate, recover, then learn."]},

{t:"Full review",
 sub:"Four weeks, one last pass.",
 learn:[
  ["How to review","This is the big one. Answer each review card's heading out loud first. Then do the quiz cold, without scrolling back. Anything you miss tells you which day to redo."]
 ],
 real:["Latitude Financial, 2023","In March 2023 an attack through a major vendor gave attackers a Latitude Financial employee's login. They took about 14 million Australian and NZ records, including millions of driver licence numbers, some kept since 2005. Latitude refused to pay. Third-party access and keeping too much data, in one story."],
 myth:["Once you've finished Stage 1, the basics are done.","The basics are what most breaches exploit: missing MFA, unpatched systems, weak access control and ignored alerts. You'll use these ideas at every level."],
 tryit:{h:"Build a one-page cheat sheet", where:"Paper or notes app",
  p:"From memory, write down the key ports, the Windows Event IDs, the MFA ranking, the permission octals and the six CSF 2.0 functions. Then check it against the cards. Keep it for interview prep."},
 review:[
  ["Week 1","CIA, and double extortion hitting all three. Threats include insiders and accidents. Risk is likelihood and impact. Authorisation is checked on every request, with least privilege. SMS is MFA but weak; only FIDO2 keys and passkeys are phishing-resistant."],
  ["Week 2","Open means listening, not vulnerable. TCP has a handshake; UDP doesn't. DHCP, ARP, DNS, TCP and TLS get a laptop to a website. The padlock means encrypted, not honest."],
  ["Week 3","Config lives in /etc or the Registry. Read rwx and octal. Judge a process by its path and parent, not its name. Hash passwords with bcrypt or Argon2. Vulnerable VMs never go on bridged networks."],
  ["Week 4","Nmap finds hosts, ports and versions, with permission only. Wireshark shows the wire. Logs and a SIEM catch what attackers leave behind. Incident response now follows the CSF 2.0 functions. Defence in depth means no single control does everything."],
  ["Explain: SMS MFA","SMS counts as MFA, but SIM swapping and fake login pages can steal the code. App codes can be phished too. FIDO2 keys and passkeys check the real domain, so a phishing site gets nothing."],
  ["Explain: open ports","Open just means a service is listening. Risk depends on what it is, its version, its configuration and who can reach it. RDP open to the internet is risky; 443 on a patched web server is expected."],
  ["Explain: backups","Offline or immutable backups restore encrypted data and get you running again. They do nothing about data that's already been stolen, the other half of double extortion."],
  ["Explain: HTTPS","TLS checks the server's certificate, agrees session keys, then encrypts traffic between browser and server. The data is decrypted at the server, so stored data needs its own protection."]
 ],
 quiz:[
  {d:2, q:"Which statement is correct?", o:["Backups prevent data theft","An open port proves a vulnerability","A passkey resists phishing better than an SMS code"], k:2,
   w:"Passkeys are bound to the real site. The other two are misconceptions this plan set out to fix."},
  {d:2, q:"In OWASP Top 10:2025, what is A09?", o:["Security Logging and Alerting Failures","Broken Access Control","Injection"], k:0,
   w:"A01 is Broken Access Control and A05 is Injection."},
  {d:1, q:"Ransomware steals data, then encrypts it. Which pillars are hit?", o:["Confidentiality, integrity and availability","Availability only","Integrity only"], k:0,
   w:"Theft breaks confidentiality, unauthorised encryption breaks integrity and lost access breaks availability."},
  {d:2, q:"Which of these is the most worrying open port?", o:["RDP open to the internet on an unpatched server","443 open on a patched web server","53 open on the internal DNS server"], k:0,
   w:"The other two are expected services. Exposed, unpatched RDP is a common ransomware entry point."},
  {d:3, q:"The four-phase incident response cycle comes from which document?", o:["NIST SP 800-61 Rev. 2","NIST SP 800-61 Rev. 3","OWASP Top 10:2025"], k:0,
   w:"Rev. 2 had the four phases. Rev. 3 (April 2025) organises incident response around the CSF 2.0 functions."},
  {d:1, q:"Which network mode should a deliberately vulnerable VM use?", o:["Internal or host-only","Bridged","NAT with port forwarding to the internet"], k:0,
   w:"Keep vulnerable machines off your real network and away from the internet."},
  {d:3, q:"A file owned by alice, group staff, is set to 640. What can a staff member who isn't alice do?", o:["Read it","Read and write it","Nothing"], k:0,
   w:"6 gives the owner rw-, 4 gives the group r--, and 0 gives others nothing."},
  {d:1, q:"What does hardening mean?", o:["Changing insecure defaults to shrink the attack surface","Keeping the vendor's default settings","Buying a bigger firewall"], k:0,
   w:"Hardening removes or changes what an attacker could use: default credentials, unneeded services, open ports and unused software."}
 ],
 recap:["You can explain CIA, risk, AAA and MFA strength.","You can trace a connection from DHCP to TLS.","You can read permissions, processes, hashes and logs.","Score 80% or more across all days before moving to intermediate."]},

{t:"What comes next",
 sub:"From fundamentals to a job-ready portfolio.",
 learn:[
  ["What you've covered","Security fundamentals, networking, operating systems, cryptography, scanning, packet capture and logs. That's the base every intermediate topic builds on."],
  ["The intermediate stage","Next comes frameworks in depth (NIST CSF 2.0, ISO 27001, the Essential Eight), security tools, configuring controls, vulnerability management and cloud security basics."],
  ["Grow the lab","Add a deliberately vulnerable VM, such as Metasploitable 2, on the internal network only. Add a SIEM, such as Wazuh (give it 4 to 8 GB of RAM), and send it Windows and Linux logs. Then attack your lab and detect yourself."],
  ["Show your work","Write up each lab on GitHub: goal, setup, steps, what you saw and what you'd fix. Screenshots and clear explanations beat a list of courses. Never publish real credentials or anything from an employer's systems."],
  ["Certifications","CompTIA Security+ is a common first security certification and often appears in entry-level job ads. For cloud roles, start with an entry cert like AWS Cloud Practitioner or Microsoft SC-900, then aim for a cloud security cert. Pair any cert with lab write-ups."],
  ["Keep the habit","A few cards a day beats a cram. Redo red days in the Days picker. Follow alerts from Australia's ACSC and New Zealand's NCSC, and read one incident write-up a week."]
 ],
 real:["What hiring managers look for","Entry-level security roles usually want networking and OS basics, log analysis, some scripting and clear communication. IT support is a real asset: you already troubleshoot, document and calm down stressed users. Say that in interviews, with examples."],
 myth:["Certifications alone will get you hired.","They help you get past filters, but interviews test whether you can do and explain the work. Documented lab projects prove that."],
 tryit:{h:"Start your portfolio repo", where:"GitHub",
  p:"Create a public repo called homelab and add a README for your Day 25 lab using this outline. Keep it short and use screenshots from your own lab only.",
  code:`# Lab 01: Scan and watch
## Goal
Detect an Nmap SYN scan from the defender's side.
## Setup
VirtualBox internal network. Kali 10.10.10.10, Windows 10.10.10.20.
## Steps
## What I saw
## What I'd change in a real network`},
 quiz:[
  {d:1, q:"What's the strongest evidence of skill for an employer?", o:["Watching more videos","Documented hands-on projects","Memorising port numbers"], k:1,
   w:"Write-ups of real lab work show what you can do, not just what you've read."},
  {d:1, q:"Where should Metasploitable 2 be connected in your lab?", o:["An internal or host-only network","A bridged adapter","NAT with ports forwarded from the internet"], k:0,
   w:"It's deliberately full of holes. It must never be reachable from your home network or the internet."},
  {d:2, q:"Which of these should never go in a public lab write-up?", o:["Real credentials or details from an employer's systems","Screenshots from your own lab","What you'd do differently next time"], k:0,
   w:"Publishing real credentials or work details is a breach in its own right. Keep write-ups to your own lab."},
  {d:1, q:"What does a SIEM add to your lab?", o:["Central log collection and alerting","Faster internet","Another vulnerable target"], k:0,
   w:"A SIEM lets you practise the defender's job: collecting logs, writing detections and responding to alerts."}
 ],
 recap:["Stage 1 done: fundamentals, networking, OS, crypto, hands-on analysis.","Grow the lab with a vulnerable VM and a SIEM, kept internal.","Write up everything on GitHub.","Next: the intermediate stage."]}
];

const FEED_DECKS = [
/* ---------------- FEED: OWASP Top 10:2025 decks ---------------- */
{id:"owasp-a01", kind:"owasp", tag:"A01", title:"Broken Access Control",
 cards:[
  ["What it is","Users can act outside their intended permissions: reading other people's records, changing someone else's account or reaching admin pages. It's number one in OWASP Top 10:2025."],
  ["Real example","In 2019 First American Financial exposed about 885 million records because document links used sequential numbers with no ownership check. Change the number in the address and you saw someone else's documents."],
  ["SSRF lives here now","Server-side request forgery (SSRF) tricks a server into fetching a URL for the attacker, often an internal one. It moved into A01 in 2025. At Capital One in 2019, SSRF let an attacker make a cloud server fetch its own credentials."],
  ["How to prevent it","Deny by default and check authorisation on the server for every request, including that the user owns the record. Never rely on hidden links or client-side checks. For SSRF, allow-list outbound destinations, block requests to cloud metadata addresses, and on AWS require IMDSv2, which makes simple SSRF far harder."]
 ],
 q:{q:"A user changes `/orders/1043` to `/orders/1044` and sees a stranger's order. What's missing?", o:["A server-side check that the order belongs to the user","Stronger TLS","A longer session timeout"], k:0,
   w:"This is an insecure direct object reference, a classic A01 flaw. The server must check ownership on every request."}},

{id:"owasp-a02", kind:"owasp", tag:"A02", title:"Security Misconfiguration",
 cards:[
  ["What it is","Insecure settings rather than buggy code: default passwords, unneeded features left on, verbose error pages, open cloud storage, missing security headers. It rose to A02 in 2025 because modern apps are mostly configuration."],
  ["Real example","Researchers regularly find cloud storage buckets and databases left open to the internet with no password, exposing millions of records. Nobody hacked anything clever; a setting was simply wrong."],
  ["How to prevent it","Build every environment from the same hardened, repeatable configuration. Remove features and accounts you don't use. Scan cloud settings automatically, for example with a cloud security posture management tool, and review them after every change."]
 ],
 q:{q:"A production web app shows full stack traces with file paths when it errors. Which category fits best?", o:["A02 Security Misconfiguration","A05 Injection","A07 Authentication Failures"], k:0,
   w:"Debug output left switched on in production is a configuration mistake. It also touches A10, which covers error handling. Either way, it hands attackers a map of your code."}},

{id:"owasp-a03", kind:"owasp", tag:"A03", title:"Software Supply Chain Failures",
 cards:[
  ["What it is","New in 2025. It expands 2021's Vulnerable and Outdated Components to the whole supply chain: the libraries you depend on, build tools, CI/CD pipelines and the people who maintain them. You inherit their weaknesses."],
  ["Real example","In March 2024 an engineer noticed SSH logins were about half a second slow and traced it to a backdoor in the xz compression library. A contributor had spent around two years earning maintainer trust before slipping it in. It was caught before most stable Linux releases shipped it."],
  ["How to prevent it","Know what you run: keep a software bill of materials (SBOM). Scan dependencies for known vulnerabilities and update promptly. Pin versions, verify signatures, use trusted registries and lock down who can change your build pipeline."]
 ],
 q:{q:"Which practice helps most to find out whether you're affected when a new library flaw is announced?", o:["Keeping a software bill of materials (SBOM)","Turning on MFA for staff","Using longer passwords"], k:0,
   w:"An SBOM lists every component and version you ship, so you can answer “are we exposed?” in minutes instead of days."}},

{id:"owasp-a04", kind:"owasp", tag:"A04", title:"Cryptographic Failures",
 cards:[
  ["What it is","Sensitive data isn't properly protected by cryptography: sent over plain HTTP, stored unencrypted, hashed with fast algorithms like MD5, or protected with weak or hard-coded keys."],
  ["Real example","In 2013 Adobe lost data on around 150 million accounts. The passwords were encrypted with one key in a weak mode instead of being hashed, so identical passwords produced identical results. Password hints sat beside them in plain text."],
  ["How to prevent it","Use TLS 1.2 or 1.3 everywhere. Encrypt sensitive data at rest. Hash passwords with Argon2 or bcrypt. Keep keys in a key management service, never in source code, and never invent your own crypto."]
 ],
 q:{q:"A developer stores API keys in the app's source code on GitHub. What's the best fix?", o:["Move them to a secrets manager and rotate the exposed keys","Make the repository private and carry on","Base64-encode the keys"], k:0,
   w:"Once a key has been committed it's compromised, so rotate it. Base64 is encoding, not protection."}},

{id:"owasp-a05", kind:"owasp", tag:"A05", title:"Injection",
 cards:[
  ["What it is","The app treats untrusted input as code or commands. SQL injection, OS command injection and cross-site scripting (XSS) all fall here. It's A05 in 2025."],
  ["Real example","In May 2023 the Cl0p gang exploited a SQL injection zero-day in MOVEit Transfer, a file-transfer product. They stole data from thousands of organisations, affecting tens of millions of people, before most victims knew the flaw existed."],
  ["How to prevent it","Use parameterised queries or a safe ORM, never string-built SQL. Encode output for the context it lands in (HTML, JavaScript, URLs) to stop XSS. Validate input against an allow-list, and give database accounts least privilege."]
 ],
 q:{q:"Which of these stops SQL injection most reliably?", o:["Parameterised queries","Hiding error messages","Using HTTPS"], k:0,
   w:"Parameters keep data separate from the query, so input can't change its meaning. Hiding errors only makes it harder to spot."}},

{id:"owasp-a06", kind:"owasp", tag:"A06", title:"Insecure Design",
 cards:[
  ["What it is","Flaws in the design itself, not in the code. A perfectly coded feature can still be unsafe if nobody thought about how it could be abused. You can't patch your way out of a bad design."],
  ["Real example","A password reset that relies on security questions like “mother's maiden name” is insecure by design: the answers are often public. So is a checkout that lets one user reserve unlimited stock with no rate limit."],
  ["How to prevent it","Threat model new features before building them: ask what could go wrong and who would abuse it. Write abuse cases next to user stories. Use proven secure design patterns, and build in limits such as rate limiting and per-user caps."]
 ],
 q:{q:"What's the most effective time to catch an insecure design flaw?", o:["During design, through threat modelling","After launch, through a penetration test","Only after an incident"], k:0,
   w:"Fixing a design on paper is cheap. Fixing it after launch can mean rebuilding the feature."}},

{id:"owasp-a07", kind:"owasp", tag:"A07", title:"Authentication Failures",
 cards:[
  ["What it is","Weaknesses in proving who someone is: no MFA, allowing weak or breached passwords, unlimited login attempts, weak account recovery or sessions that never expire."],
  ["Real example","In February 2024 attackers used stolen credentials on a Change Healthcare remote access portal that didn't require MFA. The ransomware attack that followed disrupted claims processing across US healthcare for weeks."],
  ["How to prevent it","Require MFA, ideally phishing-resistant passkeys or FIDO2 keys. Block known breached passwords. Rate-limit and monitor login attempts. Expire sessions properly and protect recovery flows as carefully as the login itself."]
 ],
 q:{q:"Which control would most directly have stopped the Change Healthcare login?", o:["MFA on the remote access portal","Disk encryption","A web application firewall rule"], k:0,
   w:"Stolen passwords alone were enough. A second factor would have blocked that first step."}},

{id:"owasp-a08", kind:"owasp", tag:"A08", title:"Software or Data Integrity Failures",
 cards:[
  ["What it is","Trusting code or data without checking it hasn't been tampered with: updates installed without a signature check, plugins from untrusted sources, or untrusted data deserialised into objects."],
  ["Real example","In the SolarWinds attack discovered in December 2020, malicious code was inserted during the build, so the poisoned Orion updates were properly signed. Customers' integrity checks passed because the build itself had been compromised."],
  ["How to prevent it","Verify digital signatures on updates and packages. Protect the CI/CD pipeline with access controls, reviews and logging. Don't deserialise untrusted data, or use formats like JSON with strict validation instead."]
 ],
 q:{q:"An app downloads and runs updates over plain HTTP without checking a signature. What's the main risk?", o:["An on-path attacker can swap in a malicious update","The update will download slowly","Users can't log in"], k:0,
   w:"Without a signature check, the app runs whatever arrives. Signatures prove who made the update and that it wasn't changed."}},

{id:"owasp-a09", kind:"owasp", tag:"A09", title:"Security Logging and Alerting Failures",
 cards:[
  ["What it is","Not logging security events, not alerting on them, or not acting on the alerts. The 2025 name stresses alerting: logs nobody watches don't stop anything. It was called Security Logging and Monitoring Failures in 2021."],
  ["Real example","During the 2013 Target breach, security tools raised alerts as the attackers set up their malware. The alerts weren't acted on in time, and about 40 million card numbers were stolen."],
  ["How to prevent it","Log logins, failures, access-control denials and admin actions with enough context. Send logs to a central SIEM, alert on suspicious patterns and test that alerts reach a person. Protect logs from tampering and have a response plan."]
 ],
 q:{q:"Your app logs failed logins, but nobody reviews them and nothing alerts. Which category is this?", o:["A09 Security Logging and Alerting Failures","A02 Security Misconfiguration","A06 Insecure Design"], k:0,
   w:"Collecting logs is only half the job. A09 is about making sure someone is alerted and acts."}},

{id:"owasp-a10", kind:"owasp", tag:"A10", title:"Mishandling of Exceptional Conditions",
 cards:[
  ["What it is","New in 2025. Apps that handle errors and unusual conditions badly: failing open, crashing on unexpected input, leaking details in error messages, or leaving a transaction half-finished."],
  ["Real example","On 19 July 2024 a faulty CrowdStrike content update triggered an out-of-bounds memory read that the Falcon sensor didn't handle, crashing about 8.5 million Windows computers. It wasn't an attack, but airlines, banks and hospitals went down."],
  ["How to prevent it","Fail safely: when something goes wrong, deny access rather than allow it. Catch and handle errors, and show users generic messages while logging the details. Test edge cases and bad input, and roll out changes in stages."]
 ],
 q:{q:"A login check throws an error when the database is slow, and the code then lets the user in. What's the flaw?", o:["Failing open instead of failing safe","Weak password hashing","Missing HTTPS"], k:0,
   w:"When a security check can't complete, the safe default is to deny. Failing open turns an outage into a breach."}},

/* ---------------- FEED: incident decks ---------------- */
{id:"inc-change", kind:"incident", tag:"2024", title:"Change Healthcare",
 cards:[
  ["What happened","In February 2024 the ALPHV/BlackCat ransomware gang hit Change Healthcare, which processes a huge share of US medical claims. Systems went offline and pharmacies and providers struggled to process claims and payments for weeks."],
  ["How they got in","Attackers logged in to a Citrix remote access portal with stolen credentials. The portal didn't require MFA. From there they moved through the network, stole data and deployed ransomware."],
  ["Impact","The company paid a US$22 million ransom. Its July 2025 notification to the US health regulator put the number of people affected at about 192.7 million, the largest healthcare data breach on record in the US."],
  ["Lessons","Every remote access portal needs MFA, with no exceptions for old systems. Paying didn't make the problem go away: data from the same attack was later used in further extortion attempts."]
 ],
 maps:"A07 Authentication Failures · MFA on remote access",
 q:{q:"What was the single missing control at Change Healthcare's entry point?", o:["MFA on the Citrix portal","Encryption of the claims database","An antivirus update"], k:0,
   w:"The attackers didn't need an exploit. Valid credentials and no second factor were enough."}},

{id:"inc-medibank", kind:"incident", tag:"2022", title:"Medibank",
 cards:[
  ["What happened","In October 2022 Australian health insurer Medibank found attackers had stolen data on about 9.7 million current and former customers, including health claims information."],
  ["How they got in","Malware on an IT service desk contractor's personal computer stole credentials the contractor had saved in their browser. The attackers used them to log in to Medibank's VPN, which didn't require MFA."],
  ["Impact","Medibank refused to pay the ransom, and the attackers published customer data on the dark web, including sensitive health records. Australia later sanctioned a Russian national over the attack."],
  ["Lessons","Contractor and admin accounts need MFA everywhere. Don't let privileged credentials live on personal devices. A refusal to pay is often right, but plan for the data being published."]
 ],
 maps:"A07 Authentication Failures · MFA and privileged access",
 q:{q:"How did the attackers first get Medibank credentials?", o:["Malware on a contractor's personal computer","A SQL injection flaw","A stolen backup tape"], k:0,
   w:"An infostealer harvested saved browser credentials. The VPN's lack of MFA turned that into a breach."}},

{id:"inc-waikato", kind:"incident", tag:"2021", title:"Waikato DHB",
 cards:[
  ["What happened","In May 2021 ransomware caused a full IT outage across Waikato District Health Board's hospitals in New Zealand (the DHB is now part of Te Whatu Ora). Staff went back to pen and paper, and many clinics and procedures were postponed."],
  ["How they got in","The full initial access details weren't published. The attackers had access long enough to steal data before encrypting systems, which shows the intrusion went unnoticed for a while."],
  ["Impact","Data exfiltration was confirmed, and patient and staff data was leaked. Recovery took weeks for core systems and much longer overall. The ransom wasn't paid."],
  ["Lessons","Health systems need tested offline backups, network segmentation and an incident plan that includes working without IT. Detecting attackers before they encrypt gives you far more options."]
 ],
 maps:"Backups, segmentation and incident response",
 q:{q:"Waikato DHB confirmed data was stolen. What does that mean for recovery from backups?", o:["Backups restore systems but can't undo the data theft","Backups also recover the stolen data from the attackers","Backups make the leak impossible"], k:0,
   w:"Double extortion hits confidentiality. Restoring brings systems back, but leaked data stays leaked."}},

{id:"inc-latitude", kind:"incident", tag:"2023", title:"Latitude Financial",
 cards:[
  ["What happened","In March 2023 Australian and New Zealand lender Latitude Financial disclosed a cyberattack. About 14 million customer records were stolen, including around 7.9 million driver licence numbers."],
  ["How they got in","The attack came in through a major vendor and gave the attackers a Latitude employee's login credentials. They used those to reach customer data held by two service providers."],
  ["Impact","Some records went back to 2005, long after customers had left. Latitude refused to pay the ransom, and regulators in both countries investigated."],
  ["Lessons","Keep data only as long as you need it. Monitor vendor and third-party access closely. Data you deleted years ago can't be stolen."]
 ],
 maps:"Third-party risk · data minimisation",
 q:{q:"Which lesson does Latitude show most clearly?", o:["Don't keep customer data longer than you need it","Always pay the ransom","Third parties never cause breaches"], k:0,
   w:"Millions of affected records belonged to former customers whose data could have been deleted."}},

{id:"inc-moveit", kind:"incident", tag:"2023", title:"MOVEit Transfer",
 cards:[
  ["What happened","In May 2023 the Cl0p ransomware gang mass-exploited MOVEit Transfer, a file-transfer product used by governments, banks and universities. They stole files rather than encrypting systems."],
  ["How they got in","A SQL injection zero-day (CVE-2023-34362) in the MOVEit web application let them run their own code and plant a web shell on internet-facing servers."],
  ["Impact","About 2,700 organisations and nearly 100 million people were affected, many through suppliers they'd never heard of. Cl0p extorted victims by threatening to publish the data."],
  ["Lessons","Internet-facing file-transfer tools are high-value targets. Patch them urgently, limit what data sits on them and for how long, and know which of your suppliers use them."]
 ],
 maps:"A05 Injection · patching and supplier risk",
 q:{q:"What type of flaw did Cl0p exploit in MOVEit Transfer?", o:["SQL injection","A weak password","A misconfigured firewall"], k:0,
   w:"It was a SQL injection zero-day in the web application, so no patch existed when the attacks began."}},

{id:"inc-log4shell", kind:"incident", tag:"2021", title:"Log4Shell",
 cards:[
  ["What happened","In December 2021 a critical flaw (CVE-2021-44228) was disclosed in Log4j, a logging library inside a huge number of Java applications. It scored the maximum 10.0 severity."],
  ["How it worked","If an app logged a string an attacker controlled, such as a username or browser header, Log4j could follow a lookup in that string and load remote code. Simply getting text into a log was enough."],
  ["Impact","Attackers began scanning for it within hours. Many organisations didn't know where they used Log4j, because it was buried inside other products and libraries."],
  ["Lessons","Know your dependencies, including the ones inside other software. A software bill of materials and fast patching turn a crisis into a checklist."]
 ],
 maps:"A03 Software Supply Chain Failures · SBOM",
 q:{q:"Why was Log4Shell so hard for many organisations to respond to?", o:["They didn't know which systems contained Log4j","The patch was never released","It only affected Windows"], k:0,
   w:"Log4j was often a dependency of a dependency. Without an inventory, teams had to hunt for it system by system."}},

{id:"inc-xz", kind:"incident", tag:"2024", title:"The xz utils backdoor",
 cards:[
  ["What happened","In March 2024 Microsoft engineer Andres Freund noticed SSH logins on a test system using more CPU and taking about half a second longer. He traced it to a backdoor in xz utils versions 5.6.0 and 5.6.1."],
  ["How it got in","A contributor known as “Jia Tan” spent around two years building trust in the project and became a maintainer. The malicious code was hidden in test files and build scripts, not in the visible source."],
  ["Impact","The backdoor targeted SSH on some Linux distributions. It was caught while mostly in testing and rolling releases, before most stable systems. Kali, a rolling release, briefly shipped it in late March 2024. It could have given someone remote access to many servers."],
  ["Lessons","Open-source projects often rest on a few unpaid maintainers. Watch for unexpected behaviour, check what's in release packages, and treat build pipelines as part of your attack surface."]
 ],
 maps:"A03 Software Supply Chain Failures",
 q:{q:"How was the xz backdoor discovered?", o:["An engineer investigated slow SSH logins","An antivirus alert","The attacker confessed"], k:0,
   w:"Curiosity about a small performance change caught one of the most serious supply chain attacks yet."}},

{id:"inc-crowdstrike", kind:"incident", tag:"2024", title:"CrowdStrike outage",
 cards:[
  ["What happened","On 19 July 2024 a faulty content update for CrowdStrike's Falcon sensor crashed about 8.5 million Windows computers, which got stuck on a blue screen at boot."],
  ["What went wrong","It wasn't an attack. The update contained data the sensor's code didn't expect, causing an out-of-bounds memory read inside a kernel driver. The error wasn't handled, so Windows crashed."],
  ["Impact","Airlines grounded flights, and hospitals, banks and broadcasters were disrupted around the world. Many machines needed hands-on fixes, one at a time, often with BitLocker recovery keys."],
  ["Lessons","Test updates against unexpected input, roll them out in stages and handle errors safely. Keep BitLocker recovery keys somewhere you can reach when Windows won't boot."]
 ],
 maps:"A10 Mishandling of Exceptional Conditions · staged rollouts",
 q:{q:"Which OWASP Top 10:2025 category best fits the CrowdStrike crash?", o:["A10 Mishandling of Exceptional Conditions","A05 Injection","A07 Authentication Failures"], k:0,
   w:"Unexpected input caused an unhandled error. A10 is about handling exceptional conditions safely."}},

{id:"inc-uber", kind:"incident", tag:"2022", title:"Uber",
 cards:[
  ["What happened","In September 2022 an attacker got broad access to Uber's internal systems, including chat, cloud consoles and security tools, and announced it in Uber's own Slack."],
  ["How they got in","They had a contractor's password and spammed MFA push requests. Then they contacted the contractor on WhatsApp, posing as Uber IT, until the contractor approved one."],
  ["Going deeper","Inside, the attacker found a PowerShell script on a network share with hard-coded admin credentials for Uber's privileged access management system. That unlocked much more."],
  ["Lessons","Use phishing-resistant MFA or at least number matching. Never hard-code secrets in scripts; use a secrets manager. Teach staff that real IT won't pressure them to approve prompts."]
 ],
 maps:"A07 Authentication Failures · secrets management",
 q:{q:"What turned one approved MFA prompt into broad access at Uber?", o:["Admin credentials hard-coded in a script on a network share","A zero-day in Slack","An unpatched VPN"], k:0,
   w:"Secrets left in plain text let the attacker escalate quickly. Secrets belong in a vault, not in scripts."}},

{id:"inc-capitalone", kind:"incident", tag:"2019", title:"Capital One",
 cards:[
  ["What happened","In 2019 a former Amazon Web Services engineer copied data on about 100 million people in the US and 6 million in Canada from Capital One's AWS environment."],
  ["How they got in","A misconfigured web application firewall was vulnerable to server-side request forgery (SSRF). The attacker made it request the cloud metadata service, which returned temporary credentials."],
  ["Impact","Those credentials had broad access to storage buckets. Capital One was later fined US$80 million by a US regulator and settled a class action."],
  ["Lessons","SSRF is now part of A01 Broken Access Control. Require IMDSv2 on AWS, block metadata access from apps that don't need it, and give cloud roles least privilege."]
 ],
 maps:"A01 Broken Access Control (SSRF) · least privilege",
 q:{q:"What did the SSRF flaw let the attacker obtain at Capital One?", o:["Temporary cloud credentials from the metadata service","The CEO's password","A copy of the firewall's source code"], k:0,
   w:"The server fetched its own credentials on the attacker's behalf. Over-broad permissions did the rest."}}
];

const PY_LEVELS = [
  {name:"Basics", from:0, to:6},
  {name:"Security scripts", from:6, to:12},
  {name:"Cloud and capstone", from:12, to:14}
];
const PY_LESSONS = [
/* ---------------- PYTHON TRACK ----------------
   Same shape as a Study day, plus:
