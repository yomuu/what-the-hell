# Bunker Radio: fetches the security news feeds every 6 hours and commits content/wire.json,
# only when something changed. The app reads it fresh each time it opens (no version bump needed).
name: Bunker Radio wire
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wire
  cancel-in-progress: false
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the feeds
        run: node tools/fetch-wire.js
      - name: Check the app
        run: node tools/check.js
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- content/wire.json && [ -z "$(git ls-files --others --exclude-standard content/wire.json)" ]; then
            echo "No change to content/wire.json"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/wire.json
          git commit -m "Bunker Radio: update wire"
          git pull --rebase origin main
          git push origin HEAD:main
